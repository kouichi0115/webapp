<title>冷蔵庫こんだて</title>

<style>
/* Layout: 1カラムのアプリ。上部にタブ、献立カードを縦に積み、最後に栄養成分表示ラベル */
:root {
  --bg: #eef3f1;
  --surface: #ffffff;
  --ink: #17262a;
  --muted: #5a6c6c;
  --line: #d3dedb;
  --accent: #1c7262;
  --accent-soft: #dcefe9;
  --accent-ink: #ffffff;
  --ok: #2e7a3a;
  --ok-bg: #e2f2e3;
  --warn: #9a5b00;
  --warn-bg: #fdf0d9;
  --bad: #b8322a;
  --bad-bg: #fbe3e0;
  --font-display: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Noto Sans JP", sans-serif;
  --font-body: "BIZ UDPGothic", "Hiragino Sans", "Noto Sans JP", "Yu Gothic", "Meiryo", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111917; --surface: #1a2422; --ink: #e2ebe8; --muted: #9aaca8; --line: #2d3b38;
    --accent: #5cc0a6; --accent-soft: #1f3530; --accent-ink: #0c1412;
    --ok: #7fcb87; --ok-bg: #1d3221; --warn: #f0b04f; --warn-bg: #3a2c12; --bad: #ff8577; --bad-bg: #3d1d1a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111917; --surface: #1a2422; --ink: #e2ebe8; --muted: #9aaca8; --line: #2d3b38;
  --accent: #5cc0a6; --accent-soft: #1f3530; --accent-ink: #0c1412;
  --ok: #7fcb87; --ok-bg: #1d3221; --warn: #f0b04f; --warn-bg: #3a2c12; --bad: #ff8577; --bad-bg: #3d1d1a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.6;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.wrap {
  max-width: 720px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
header.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--surface); border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-block: 12px 4px; }
.brand h1 { margin: 0; font-family: var(--font-display); font-size: 1.35rem; font-weight: 700; color: var(--accent); letter-spacing: .02em; }
.brand .date { color: var(--muted); font-size: .85rem; font-variant-numeric: tabular-nums; }
nav.tabs { display: flex; gap: 4px; }
nav.tabs button {
  flex: 1; border: 0; background: none; color: var(--muted); font: inherit; font-weight: 700;
  padding: 10px 4px; border-bottom: 3px solid transparent; cursor: pointer;
}
nav.tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
nav.tabs .count { display: inline-block; min-width: 1.5em; margin-left: 4px; padding: 0 6px; border-radius: 999px; background: var(--bad-bg); color: var(--bad); font-size: .75rem; }
main { padding-block: 16px 64px; display: grid; gap: 16px; }
h2 { font-family: var(--font-display); font-size: 1.1rem; margin: 0; text-wrap: balance; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
button, input, select { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn {
  border: 1px solid var(--line); background: var(--surface); border-radius: 8px;
  padding: 8px 12px; cursor: pointer; font-weight: 700; font-size: .9rem;
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.ghost { border-color: transparent; background: none; color: var(--muted); }
.btn.danger { color: var(--bad); }
.btn:disabled { opacity: .5; cursor: default; }

/* 期限アラート */
.alert { background: var(--warn-bg); color: var(--ink); border-radius: 10px; padding: 10px 14px; font-size: .9rem; }
.alert strong { color: var(--warn); }
.alert.bad strong { color: var(--bad); }

/* 献立カード */
.meal { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; gap: 10px; min-width: 0; }
.meal-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.meal-label { font-family: var(--font-display); font-weight: 700; font-size: .85rem; color: var(--accent); background: var(--accent-soft); border-radius: 6px; padding: 2px 10px; }
.meal-name { font-family: var(--font-display); font-size: 1.3rem; font-weight: 700; margin: 0; flex: 1 1 auto; min-width: 0; }
.meal-kcal { font-variant-numeric: tabular-nums; font-weight: 700; }
.meal.cooked { opacity: .75; }
.meal.cooked .meal-name::after { content: "  作った"; font-size: .8rem; color: var(--ok); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: .8rem; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); }
.chip.have { background: var(--ok-bg); border-color: transparent; color: var(--ok); }
.chip.urgent { background: var(--warn-bg); border-color: transparent; color: var(--warn); font-weight: 700; }
.chip.miss { border-style: dashed; color: var(--muted); }
.chip.pantry { color: var(--muted); border-color: transparent; background: var(--bg); }
.howto { font-size: .9rem; color: var(--muted); margin: 0; }
.pfc { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: .82rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.meal-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.meal-actions select { flex: 1 1 160px; min-width: 0; padding: 7px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); }

/* 栄養成分表示ラベル */
.label { background: var(--surface); border: 2px solid var(--ink); border-radius: 4px; padding: 12px 16px; }
.label h2 { font-family: var(--font-body); font-weight: 700; font-size: 1rem; border-bottom: 6px solid var(--ink); padding-bottom: 6px; margin-bottom: 4px; }
.label .row { display: grid; grid-template-columns: 7.5em 1fr auto; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.label .row:last-of-type { border-bottom: 0; }
.label .row b { font-weight: 700; }
.label .val { text-align: right; white-space: nowrap; }
.bar { height: 8px; background: var(--bg); border-radius: 4px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
.bar i.over { background: var(--bad); }
.bar i.low { background: var(--warn); }
.label .note { margin: 8px 0 0; font-size: .78rem; color: var(--muted); }
.balance { display: flex; height: 22px; border-radius: 4px; overflow: hidden; margin-top: 10px; font-size: .72rem; font-weight: 700; }
.balance span { display: flex; align-items: center; justify-content: center; color: var(--accent-ink); min-width: 0; overflow: hidden; white-space: nowrap; }

/* 買い足し */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; gap: 8px; }
.shop { margin: 0; padding-left: 1.2em; }

/* 冷蔵庫 */
form.add { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
form.add label { display: grid; gap: 4px; font-size: .82rem; color: var(--muted); font-weight: 700; min-width: 0; }
form.add .wide { grid-column: 1 / -1; }
form.add input, form.add select { width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); font-weight: 400; font-size: 1rem; }
.qtyunit { display: flex; gap: 6px; }
.qtyunit input { flex: 1 1 auto; min-width: 0; }
.qtyunit select { flex: 0 0 6.5em; }
.foodinfo { grid-column: 1 / -1; font-size: .82rem; color: var(--muted); min-height: 1.3em; }
.items { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.item { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; }
.item .name { font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
.item .sub { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: .85rem; color: var(--muted); }
.item .sub input[type="number"] { width: 5.5em; padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); font-variant-numeric: tabular-nums; }
.item .sub input[type="date"] { padding: 3px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
.pill { font-size: .78rem; font-weight: 700; padding: 2px 10px; border-radius: 999px; white-space: nowrap; }
.pill.ok { background: var(--ok-bg); color: var(--ok); }
.pill.warn { background: var(--warn-bg); color: var(--warn); }
.pill.bad { background: var(--bad-bg); color: var(--bad); }
.pill.none { background: var(--bg); color: var(--muted); }
.item.expired { border-color: var(--bad); }
.sample-note { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; background: var(--accent-soft); border-radius: 10px; padding: 10px 14px; font-size: .88rem; }

/* 設定 */
.field { display: grid; gap: 4px; }
.field input { padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); width: 10em; font-size: 1rem; }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  background: var(--ink); color: var(--bg); border-radius: 10px; padding: 10px 14px;
  display: flex; gap: 12px; align-items: center; max-width: calc(100% - 32px); z-index: 20; font-size: .9rem;
}
.toast button { background: none; border: 0; color: var(--accent-soft); font-weight: 700; cursor: pointer; text-decoration: underline; }
@media (max-width: 420px) {
  form.add { grid-template-columns: 1fr; }
  .meal-name { font-size: 1.15rem; }
}
@media (prefers-reduced-motion: no-preference) {
  .meal { transition: opacity .2s; }
}
</style>
</head>

const RECIPE = Object.fromEntries(RECIPES.map(r => [r.id, r]));
const MEALS = [['b','朝ごはん'],['l','昼ごはん'],['d','夜ごはん']];
const UNITS = ['個','g','ml','本','枚','パック','袋','切れ','玉','丁','束','株','缶'];

// ===== 保存 =====
const KEY = 'fridge-menu-v1';
function load() {
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && Array.isArray(s.fridge)) return s; } catch (_) {}
  return null;
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (_) {} }

// ===== 日付 =====
function ymd(d) { return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function todayStr() { return ymd(new Date()); }
function addDays(n) { const d = new Date(); d.setDate(d.getDate() + n); return ymd(d); }
function daysLeft(exp) {
  if (!exp) return null;
  return Math.round((new Date(exp + 'T00:00:00') - new Date(todayStr() + 'T00:00:00')) / 86400000);
}
function expiryPill(exp) {
  const d = daysLeft(exp);
  if (d === null) return ['none', '期限なし'];
  if (d < 0) return ['bad', `期限切れ（${-d}日前）`];
  if (d === 0) return ['bad', '今日まで'];
  if (d <= 3) return ['warn', `あと${d}日`];
  return ['ok', `あと${d}日`];
}

// ===== 初期データ（サンプル） =====
function sampleFridge() {
  const s = [['卵',6,'個',10],['牛乳',800,'ml',2],['鶏もも肉',300,'g',1],['玉ねぎ',3,'個',20],['にんじん',2,'本',14],
    ['じゃがいも',3,'個',25],['キャベツ',0.5,'個',6],['豆腐',1,'丁',3],['食パン',4,'枚',2],['豚こま肉',200,'g',2],
    ['納豆',3,'パック',5],['ヨーグルト',400,'g',4],['ベーコン',4,'枚',7],['ブロッコリー',1,'株',1],['ねぎ',1,'本',5],['鮭',2,'切れ',-1]];
  return s.map(([name, qty, unit, d], i) => ({ id: 's' + i, name, qty, unit, expiry: addDays(d), sample: true }));
}

let state = load() || { fridge: sampleFridge(), servings: 1, kcal: 2000, menu: null };

// ===== 計算 =====
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r1 = n => Math.round(n * 10) / 10;
function toGrams(item) {
  const f = FOODS[item.name];
  if (item.unit === 'g' || item.unit === 'ml') return item.qty;
  if (f && f.unit === item.unit) return item.qty * f.g;
  return NaN;
}
function fmtQty(n) { return Number.isInteger(n) ? String(n) : String(Math.round(n * 100) / 100); }
function gramsToText(name, g) {
  const f = FOODS[name];
  if (!f || f.unit === 'g' || f.unit === 'ml') return `${Math.round(g)}${f && f.unit === 'ml' ? 'ml' : 'g'}`;
  const q = g / f.g;
  const qs = q >= 1 ? fmtQty(Math.round(q * 10) / 10) : fmtQty(Math.round(q * 100) / 100);
  return `${qs}${f.unit}（${Math.round(g)}g）`;
}

// 冷蔵庫の在庫を食材ごとにまとめる（期限切れは除外）
function buildStock() {
  const stock = {};
  for (const it of state.fridge) {
    const d = daysLeft(it.expiry);
    if (d !== null && d < 0) continue;
    const g = toGrams(it);
    if (!(g > 0)) continue;
    const s = stock[it.name] || (stock[it.name] = { g: 0, days: null });
    s.g += g;
    if (d !== null && (s.days === null || d < s.days)) s.days = d;
  }
  return stock;
}
function urgency(d) { return d === null ? 0 : d <= 1 ? 3 : d <= 3 ? 2 : d <= 7 ? 1 : 0; }

function analyze(r, stock) {
  const n = state.servings;
  const out = { have: [], miss: [], pantry: [], urgent: [] };
  for (const [name, g] of r.items) {
    if (FOODS[name]?.pantry) { out.pantry.push(name); continue; }
    const s = stock[name];
    if (s && s.g >= g * n * 0.6) {
      out.have.push(name);
      if (urgency(s.days) >= 2) out.urgent.push(name);
    } else out.miss.push(name);
  }
  const need = out.have.length + out.miss.length || 1;
  let urg = 0;
  for (const name of out.have) urg += urgency(stock[name].days);
  out.score = (out.have.length / need) * 10 + urg * 1.5 - out.miss.length * 0.5;
  return out;
}
function consume(stock, r) {
  for (const [name, g] of r.items) {
    if (stock[name]) stock[name].g = Math.max(0, stock[name].g - g * state.servings);
  }
}
function nutrition(r) {
  const t = { kcal: 0, p: 0, f: 0, c: 0, s: 0 };
  for (const [name, g] of r.items) {
    const f = FOODS[name]; if (!f) continue;
    for (const k in t) t[k] += f[k] * g / 100;
  }
  return t;
}

// 1食ぶんを選ぶ（スコア + 少しのランダム）
function pick(meal, stock, exclude) {
  const cands = RECIPES.filter(r => r.meals.includes(meal) && !exclude.includes(r.id));
  let best = null, bestScore = -Infinity;
  for (const r of cands) {
    const sc = analyze(r, stock).score + Math.random() * 2.5;
    if (sc > bestScore) { bestScore = sc; best = r; }
  }
  return best ? best.id : RECIPES.find(r => r.meals.includes(meal)).id;
}
function makeMenu() {
  const stock = buildStock();
  const menu = { date: todayStr(), cooked: {} };
  const used = [];
  for (const [m] of MEALS) {
    menu[m] = pick(m, stock, used);
    used.push(menu[m]);
    consume(stock, RECIPE[menu[m]]);
  }
  state.menu = menu; save();
}
// 他の食事で使うぶんを引いた在庫
function stockExcept(meal) {
  const stock = buildStock();
  for (const [m] of MEALS) if (m !== meal && !state.menu.cooked[m]) consume(stock, RECIPE[state.menu[m]]);
  return stock;
}
function reroll(meal) {
  const others = MEALS.map(([m]) => state.menu[m]);
  state.menu[meal] = pick(meal, stockExcept(meal), others);
  state.menu.cooked[meal] = false;
  save(); render();
}

// 作った → 期限の近いものから冷蔵庫の量を減らす
let undoSnapshot = null;
function cook(meal) {
  const r = RECIPE[state.menu[meal]];
  undoSnapshot = JSON.stringify(state);
  const used = [];
  for (const [name, g] of r.items) {
    if (FOODS[name]?.pantry) continue;
    let left = g * state.servings;
    const rows = state.fridge.filter(it => it.name === name && toGrams(it) > 0)
      .sort((a, b) => (a.expiry || '9999') < (b.expiry || '9999') ? -1 : 1);
    if (!rows.length) continue;
    used.push(name);
    for (const it of rows) {
      if (left <= 0) break;
      const have = toGrams(it);
      const take = Math.min(have, left);
      left -= take;
      const per = have / it.qty;
      it.qty = Math.round((it.qty - take / per) * 100) / 100;
    }
  }
  state.fridge = state.fridge.filter(it => !(it.qty <= 0.01));
  state.menu.cooked[meal] = true;
  save(); render();
  toast(used.length ? `冷蔵庫から ${used.join('・')} を減らしました` : '作った記録をつけました', true);
}

// ===== 画面 =====
let tab = 'menu';
function setTab(t) {
  tab = t;
  for (const b of document.querySelectorAll('nav.tabs button')) b.setAttribute('aria-selected', b.dataset.tab === t);
  for (const id of ['menu','fridge','prefs']) document.getElementById('view-' + id).hidden = id !== t;
  render();
  window.scrollTo(0, 0);
}

function render() {
  const now = new Date();
  document.getElementById('today').textContent = `${now.getMonth()+1}月${now.getDate()}日（${'日月火水木金土'[now.getDay()]}）`;
  const soon = state.fridge.filter(it => { const d = daysLeft(it.expiry); return d !== null && d <= 1; }).length;
  const ec = document.getElementById('expCount');
  ec.hidden = !soon; ec.textContent = soon;
  if (!state.menu || state.menu.date !== todayStr() || !RECIPE[state.menu.b]) makeMenu();
  if (tab === 'menu') renderMenu();
  if (tab === 'fridge') renderFridge();
  if (tab === 'prefs') renderPrefs();
}

function renderMenu() {
  const el = document.getElementById('view-menu');
  const n = state.servings;
  // 期限アラート
  const expired = [], soon = [];
  for (const it of state.fridge) {
    const d = daysLeft(it.expiry);
    if (d === null) continue;
    if (d < 0) expired.push(it.name);
    else if (d <= 2) soon.push(`${it.name}（${d === 0 ? '今日' : 'あと' + d + '日'}）`);
  }
  let html = '';
  if (soon.length) html += `<div class="alert"><strong>期限が近い食材：</strong>${esc(soon.join('、'))}<br><span class="small muted">これらを優先して使う献立にしています。</span></div>`;
  if (expired.length) html += `<div class="alert bad"><strong>期限切れ：</strong>${esc(expired.join('、'))}<span class="small muted">（献立には使いません。冷蔵庫タブで確認してください）</span></div>`;

  const total = { kcal: 0, p: 0, f: 0, c: 0, s: 0 };
  const shopping = {};
  for (const [m, label] of MEALS) {
    const r = RECIPE[state.menu[m]];
    const stock = stockExcept(m);
    const a = analyze(r, stock);
    const nu = nutrition(r);
    for (const k in total) total[k] += nu[k];
    const cooked = !!state.menu.cooked[m];
    if (!cooked) for (const name of a.miss) {
      const g = r.items.filter(([x]) => x === name).reduce((s, [, v]) => s + v, 0) * n;
      shopping[name] = (shopping[name] || 0) + g;
    }
    const amount = name => {
      const g = r.items.filter(([x]) => x === name).reduce((s, [, v]) => s + v, 0) * n;
      return gramsToText(name, g);
    };
    const chips = [
      ...a.have.map(x => `<span class="chip ${a.urgent.includes(x) ? 'urgent' : 'have'}" title="冷蔵庫にあります">${a.urgent.includes(x) ? '期限近 ' : '✓ '}${esc(x)} ${esc(amount(x))}</span>`),
      ...a.miss.map(x => `<span class="chip miss" title="冷蔵庫にありません">買う ${esc(x)} ${esc(amount(x))}</span>`),
      ...a.pantry.filter(x => !['塩','油'].includes(x)).map(x => `<span class="chip pantry">${esc(x)}</span>`),
    ].join('');
    const options = RECIPES.filter(x => x.meals.includes(m))
      .map(x => ({ x, a: analyze(x, stock) }))
      .sort((p, q) => q.a.score - p.a.score)
      .map(({ x, a }) => `<option value="${x.id}" ${x.id === r.id ? 'selected' : ''}>${a.miss.length ? '' : '◎ '}${esc(x.name)}${a.miss.length ? `（${a.miss.length}品不足）` : ''}</option>`).join('');
    html += `<section class="meal ${cooked ? 'cooked' : ''}" aria-label="${label}">
      <div class="meal-head"><span class="meal-label">${label}</span><h2 class="meal-name">${esc(r.name)}</h2><span class="meal-kcal">${Math.round(nu.kcal)} kcal</span></div>
      <div class="chips">${chips}</div>
      <p class="howto">${esc(r.howto)}</p>
      <div class="pfc"><span>たんぱく質 ${r1(nu.p)}g</span><span>脂質 ${r1(nu.f)}g</span><span>炭水化物 ${r1(nu.c)}g</span><span>食塩 ${r1(nu.s)}g</span></div>
      <div class="meal-actions">
        <button class="btn" type="button" data-reroll="${m}">別の案</button>
        <select id="sel-${m}" data-choose="${m}" aria-label="${label}のメニューを選ぶ">${options}</select>
        <button class="btn primary" type="button" data-cook="${m}" ${cooked ? 'disabled' : ''}>${cooked ? '作った ✓' : '作った'}</button>
      </div>
    </section>`;
  }

  // 栄養成分表示
  const T = { kcal: state.kcal, p: state.kcal * 0.15 / 4, f: state.kcal * 0.25 / 9, c: state.kcal * 0.6 / 4, s: 7.0 };
  const row = (label, key, unit, mode) => {
    const v = total[key], t = T[key], pct = Math.min(100, v / t * 100);
    let cls = '';
    if (mode === 'max' && v > t) cls = 'over';
    if (mode === 'range' && (v > t * 1.15)) cls = 'over';
    if (mode === 'range' && (v < t * 0.75)) cls = 'low';
    return `<div class="row"><b>${label}</b><div class="bar" aria-hidden="true"><i class="${cls}" style="width:${pct}%"></i></div><span class="val">${key === 'kcal' ? Math.round(v) : r1(v)}${unit} <span class="muted small">/ ${key === 'kcal' ? Math.round(t) : r1(t)}${unit}</span></span></div>`;
  };
  const pk = total.p * 4, fk = total.f * 9, ck = total.c * 4, sum = pk + fk + ck || 1;
  html += `<section class="label" aria-label="栄養成分表示">
    <h2>栄養成分表示（1日・1人あたり）</h2>
    ${row('エネルギー', 'kcal', 'kcal', 'range')}
    ${row('たんぱく質', 'p', 'g', 'range')}
    ${row('脂質', 'f', 'g', 'range')}
    ${row('炭水化物', 'c', 'g', 'range')}
    ${row('食塩相当量', 's', 'g', 'max')}
    <div class="balance" aria-label="PFCバランス">
      <span style="width:${pk/sum*100}%;background:var(--accent)">P ${Math.round(pk/sum*100)}%</span>
      <span style="width:${fk/sum*100}%;background:var(--warn)">F ${Math.round(fk/sum*100)}%</span>
      <span style="width:${ck/sum*100}%;background:var(--muted)">C ${Math.round(ck/sum*100)}%</span>
    </div>
    <p class="note">目標：エネルギー ${state.kcal}kcal（設定で変更）／PFC比 15:25:60／食塩 7.0g未満。数値は食品成分表をもとにした目安で、間食・飲み物は含みません。</p>
  </section>`;

  const shopList = Object.entries(shopping);
  html += `<section class="panel"><h2>買い足しリスト</h2>${shopList.length
    ? `<ul class="shop">${shopList.map(([name, g]) => `<li>${esc(name)} ${esc(gramsToText(name, g))}</li>`).join('')}</ul>`
    : '<p class="muted small" style="margin:0">今日の献立は冷蔵庫の食材だけで作れます。</p>'}
    <button class="btn" type="button" id="regen" style="justify-self:start">3食まとめて考え直す</button></section>`;
  el.innerHTML = html;
}

function renderFridge() {
  const el = document.getElementById('view-fridge');
  const sorted = [...state.fridge].sort((a, b) => (a.expiry || '9999') < (b.expiry || '9999') ? -1 : (a.expiry || '9999') > (b.expiry || '9999') ? 1 : a.name.localeCompare(b.name, 'ja'));
  const hasSample = state.fridge.some(it => it.sample);
  const datalist = Object.keys(FOODS).filter(k => !FOODS[k].pantry).map(k => `<option value="${esc(k)}"></option>`).join('');
  el.innerHTML = `
    <section class="panel">
      <h2>食材を登録</h2>
      <form class="add" id="addForm" autocomplete="off">
        <label class="wide">食材名<input id="f-name" list="foodlist" required placeholder="例：卵、鶏もも肉、キャベツ"><datalist id="foodlist">${datalist}</datalist></label>
        <label>量<span class="qtyunit"><input id="f-qty" type="number" inputmode="decimal" min="0" step="any" required value="1"><select id="f-unit">${UNITS.map(u => `<option>${u}</option>`).join('')}</select></span></label>
        <label>賞味・消費期限<input id="f-exp" type="date"></label>
        <div class="foodinfo" id="f-info"></div>
        <button class="btn primary wide" type="submit">冷蔵庫に入れる</button>
      </form>
    </section>
    ${hasSample ? `<div class="sample-note"><span>いま入っているのは<b>サンプルの食材</b>です。</span><button class="btn" type="button" id="clearSample">サンプルを消す</button></div>` : ''}
    <section style="display:grid;gap:8px">
      <h2>冷蔵庫の中身 <span class="muted small">${state.fridge.length}品・期限の近い順</span></h2>
      ${sorted.length ? `<ul class="items">${sorted.map(it => {
        const [cls, txt] = expiryPill(it.expiry);
        const f = FOODS[it.name];
        const info = f ? `100gあたり ${f.kcal}kcal` : '栄養データなし（献立には使われません）';
        return `<li class="item ${cls === 'bad' && daysLeft(it.expiry) < 0 ? 'expired' : ''}">
          <span class="name">${esc(it.name)}${it.sample ? ' <span class="muted small">サンプル</span>' : ''}</span>
          <span class="pill ${cls}">${txt}</span>
          <div class="sub">
            <label>量 <input type="number" min="0" step="any" value="${fmtQty(it.qty)}" data-qty="${it.id}" aria-label="${esc(it.name)}の量"> ${esc(it.unit)}</label>
            <label>期限 <input type="date" value="${esc(it.expiry || '')}" data-exp="${it.id}" aria-label="${esc(it.name)}の期限"></label>
            <span>${info}</span>
            <button class="btn ghost danger" type="button" data-del="${it.id}" aria-label="${esc(it.name)}を削除">削除</button>
          </div></li>`;
      }).join('')}</ul>` : '<p class="muted">まだ何も入っていません。上のフォームから食材を登録すると、その食材を使った献立を考えます。</p>'}
    </section>`;
  updateFoodInfo();
}

function updateFoodInfo() {
  const nameEl = document.getElementById('f-name'); if (!nameEl) return;
  const f = FOODS[nameEl.value.trim()];
  const info = document.getElementById('f-info');
  if (!nameEl.value.trim()) { info.textContent = '候補から選ぶと、栄養計算と献立づくりに使われます。'; return; }
  if (!f) { info.textContent = '登録はできますが、栄養データがないため献立には使われません。'; return; }
  info.textContent = `100gあたり ${f.kcal}kcal・たんぱく質${f.p}g・脂質${f.f}g・炭水化物${f.c}g` + (f.unit !== 'g' && f.unit !== 'ml' ? `（1${f.unit}＝約${f.g}g）` : '');
}

function renderPrefs() {
  const el = document.getElementById('view-prefs');
  el.innerHTML = `
    <section class="panel">
      <h2>献立の設定</h2>
      <label class="field">何人分つくる？<input id="p-serv" type="number" min="1" max="10" step="1" value="${state.servings}"></label>
      <p class="small muted" style="margin:0">冷蔵庫に足りるかの判定と、「作った」で減らす量に使います。栄養は1人あたりで表示します。</p>
      <label class="field">1日の目標エネルギー（kcal）<input id="p-kcal" type="number" min="800" max="4000" step="50" value="${state.kcal}"></label>
      <p class="small muted" style="margin:0">目安（ふつうの活動量）：成人女性 1,700〜2,050kcal、成人男性 2,200〜2,700kcal。</p>
    </section>
    <section class="panel">
      <h2>データ</h2>
      <p class="small muted" style="margin:0">冷蔵庫の中身はこの端末のブラウザに保存されます。別の端末とは共有されません。</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn danger" type="button" id="wipe">冷蔵庫を空にする</button>
        <button class="btn" type="button" id="resample">サンプルを入れ直す</button>
      </div>
      <p class="small muted" style="margin:0">登録できる食材 ${Object.values(FOODS).filter(f => !f.pantry).length}種類・レシピ ${RECIPES.length}品。ごはん・パスタ・調味料は常備している前提で計算します。</p>
    </section>`;
}

let toastTimer;
function toast(msg, undo) {
  const t = document.getElementById('toast');
  document.getElementById('toastMsg').textContent = msg;
  document.getElementById('toastUndo').hidden = !undo;
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, 6000);
}

// ===== 操作 =====
document.querySelector('nav.tabs').addEventListener('click', e => { const b = e.target.closest('button[data-tab]'); if (b) setTab(b.dataset.tab); });
document.getElementById('toastUndo').addEventListener('click', () => {
  if (undoSnapshot) { state = JSON.parse(undoSnapshot); undoSnapshot = null; save(); render(); }
  document.getElementById('toast').hidden = true;
});
document.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.reroll) reroll(t.dataset.reroll);
  else if (t.dataset.cook) cook(t.dataset.cook);
  else if (t.id === 'regen') { makeMenu(); render(); toast('3食を考え直しました'); }
  else if (t.dataset.del) {
    undoSnapshot = JSON.stringify(state);
    const it = state.fridge.find(x => x.id === t.dataset.del);
    state.fridge = state.fridge.filter(x => x.id !== t.dataset.del);
    save(); render(); toast(`${it ? it.name : '食材'}を削除しました`, true);
  }
  else if (t.id === 'clearSample') {
    undoSnapshot = JSON.stringify(state);
    state.fridge = state.fridge.filter(x => !x.sample); makeMenu(); save(); render(); toast('サンプルを消しました', true);
  }
  else if (t.id === 'wipe') {
    undoSnapshot = JSON.stringify(state);
    state.fridge = []; makeMenu(); save(); render(); toast('冷蔵庫を空にしました', true);
  }
  else if (t.id === 'resample') {
    undoSnapshot = JSON.stringify(state);
    state.fridge = state.fridge.filter(x => !x.sample).concat(sampleFridge()); makeMenu(); save(); render(); toast('サンプルを入れました', true);
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.choose) { state.menu[t.dataset.choose] = t.value; state.menu.cooked[t.dataset.choose] = false; save(); render(); }
  else if (t.dataset.qty) {
    const it = state.fridge.find(x => x.id === t.dataset.qty); const v = parseFloat(t.value);
    if (it && v >= 0) { it.qty = v; it.sample = false; if (v === 0) state.fridge = state.fridge.filter(x => x !== it); save(); render(); }
  }
  else if (t.dataset.exp) {
    const it = state.fridge.find(x => x.id === t.dataset.exp);
    if (it) { it.expiry = t.value; it.sample = false; save(); render(); }
  }
  else if (t.id === 'p-serv') { const v = parseInt(t.value, 10); if (v >= 1 && v <= 10) { state.servings = v; save(); } }
  else if (t.id === 'p-kcal') { const v = parseInt(t.value, 10); if (v >= 800 && v <= 4000) { state.kcal = v; save(); } }
});
document.addEventListener('input', e => {
  if (e.target.id === 'f-name') {
    const f = FOODS[e.target.value.trim()];
    if (f) document.getElementById('f-unit').value = f.unit;
    updateFoodInfo();
  }
});
document.addEventListener('submit', e => {
  if (e.target.id !== 'addForm') return;
  e.preventDefault();
  const name = document.getElementById('f-name').value.trim();
  const qty = parseFloat(document.getElementById('f-qty').value);
  if (!name || !(qty > 0)) return;
  const unit = document.getElementById('f-unit').value;
  const f = FOODS[name];
  if (f && unit !== 'g' && unit !== 'ml' && unit !== f.unit) {
    toast(`${name}は「${f.unit}」か「g」で登録してください`); return;
  }
  state.fridge.push({ id: 'i' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), name, qty, unit, expiry: document.getElementById('f-exp').value });
  save(); render();
  toast(`${name}を冷蔵庫に入れました`);
  document.getElementById('f-name').focus();
});

render();
</script>
</body>
</html>
