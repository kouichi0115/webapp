<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TOWA様のぼうけん</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@400;500&display=swap">
<style>
  /* Layout: one-screen game. Top bar (title + pause/sound), canvas fitted 16:9, touch pad below (portrait) or over the corners (landscape). */
  :root {
    --bg: #1b231b;          /* deep forest night, like TOWA様's portrait */
    --bg-glow: #2c3a2a;
    --leaf: #a6d79a;
    --leaf-deep: #5d8f4f;
    --cream: #fbf5e8;
    --apple: #e2434b;
    --juice: #f3d75a;
    --ink: #2a2622;
    --font-display: "Kiwi Maru", "Hiragino Maru Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: radial-gradient(ellipse at 50% 45%, var(--bg-glow), var(--bg) 70%) var(--bg);
    color: var(--cream);
    font-family: var(--font-display);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    touch-action: none;
  }
  #app { height: 100%; display: flex; flex-direction: column; }
  #top {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding-block: 8px; flex: none;
  }
  #top h1 { margin: 0; font-size: 15px; font-weight: 500; letter-spacing: 0.04em; color: var(--leaf); }
  #top .btns { display: flex; gap: 8px; }
  .icon-btn {
    width: 40px; height: 40px; border-radius: 12px;
    border: 1.5px solid color-mix(in srgb, var(--leaf) 45%, transparent);
    background: color-mix(in srgb, var(--bg) 70%, var(--leaf) 8%);
    color: var(--cream); display: grid; place-items: center; cursor: pointer; padding: 0;
    touch-action: manipulation;
  }
  .icon-btn svg { width: 20px; height: 20px; }
  .icon-btn:focus-visible, #pad button:focus-visible { outline: 2px solid var(--juice); outline-offset: 2px; }
  #stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
  canvas#game {
    display: block; border-radius: 12px;
    box-shadow: 0 0 0 1.5px color-mix(in srgb, var(--leaf) 30%, transparent), 0 0 48px color-mix(in srgb, var(--juice) 18%, transparent);
    touch-action: none; cursor: pointer;
  }
  #pad { display: none; flex: none; justify-content: space-between; align-items: center; gap: 16px; padding-block: 12px 18px; }
  body.touch #pad { display: flex; }
  #dpad {
    width: 216px; height: 104px; border-radius: 52px; position: relative; touch-action: none;
    background: color-mix(in srgb, var(--cream) 14%, transparent);
    border: 1.5px solid color-mix(in srgb, var(--cream) 35%, transparent);
  }
  #dpad .arrow { position: absolute; top: 50%; width: 0; height: 0; transform: translateY(-50%);
    border-top: 18px solid transparent; border-bottom: 18px solid transparent; opacity: .85; }
  #dpad .arrow.l { left: 34px; border-right: 26px solid var(--cream); }
  #dpad .arrow.r { right: 34px; border-left: 26px solid var(--cream); }
  #dpad.on-l .arrow.l, #dpad.on-r .arrow.r { opacity: 1; filter: drop-shadow(0 0 6px var(--juice)); }
  #dpad::after { content: ""; position: absolute; left: 50%; top: 22px; bottom: 22px; width: 1.5px;
    background: color-mix(in srgb, var(--cream) 30%, transparent); }
  #acts { display: flex; gap: 16px; align-items: flex-end; }
  #acts button {
    border-radius: 50%; border: 2px solid var(--ink); font-family: var(--font-display);
    font-size: 15px; font-weight: 500; color: var(--ink); touch-action: none; cursor: pointer; padding: 0;
  }
  #acts button.on { transform: scale(.94); filter: brightness(1.15); }
  #acts .col { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  #acts [data-act="throw"] { width: 84px; height: 84px; background: #f0868b; }
  #acts [data-act="special"] { width: 62px; height: 62px; font-size: 13px; background: #d9cfa6; opacity: .55; }
  #acts [data-act="special"].ready { background: var(--juice); opacity: 1; box-shadow: 0 0 16px var(--juice); animation: glow 1s ease-in-out infinite alternate; }
  @keyframes glow { from { box-shadow: 0 0 6px var(--juice); } to { box-shadow: 0 0 22px var(--juice); } }
  #acts [data-act="jump"] { width: 104px; height: 104px; background: var(--leaf); }
  @media (max-width: 400px) {
    #dpad { width: 176px; height: 96px; }
    #acts { gap: 10px; }
    #acts [data-act="throw"] { width: 76px; height: 76px; }
    #acts [data-act="special"] { width: 56px; height: 56px; }
    #acts [data-act="jump"] { width: 96px; height: 96px; }
  }
  @media (orientation: portrait) {
    #stage { align-items: flex-start; padding-top: 4px; }
    body.touch #stage { align-items: center; }
  }
  @media (orientation: landscape) and (max-height: 540px) {
    #top { padding-block: 4px; }
    #top h1 { display: none; }
    body.touch #top { position: absolute; top: 6px; right: max(16px, env(safe-area-inset-right, 0px)); z-index: 3; padding: 0; }
    body.touch #pad {
      position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
      bottom: calc(8px + env(safe-area-inset-bottom, 0px)); padding: 0; pointer-events: none; z-index: 2;
    }
    body.touch #pad > * { pointer-events: auto; opacity: .78; }
  }
  @media (prefers-reduced-motion: reduce) { #acts button.on { transform: none; } #acts [data-act="special"].ready { animation: none; } }
</style>

<div id="app">
  <div id="top">
    <h1>TOWA様のぼうけん</h1>
    <div class="btns">
      <button class="icon-btn" id="btnPause" type="button" aria-label="一時停止">
        <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="5" y="4" width="3.4" height="12" rx="1" fill="currentColor"/><rect x="11.6" y="4" width="3.4" height="12" rx="1" fill="currentColor"/></svg>
      </button>
      <button class="icon-btn" id="btnMute" type="button" aria-label="音を消す">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 7.5h3l4-3.5v12l-4-3.5H3z" fill="currentColor"/><path id="muteWave" d="M13 7a4 4 0 0 1 0 6M15 5a7 7 0 0 1 0 10" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/><path id="muteX" d="M13 8l4 4M17 8l-4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" hidden/></svg>
      </button>
    </div>
  </div>
  <div id="stage"><canvas id="game" width="640" height="360" aria-label="TOWA様のぼうけん ゲーム画面"></canvas></div>
  <div id="pad">
    <div id="dpad" aria-label="左右に移動"><span class="arrow l"></span><span class="arrow r"></span></div>
    <div id="acts">
      <div class="col">
        <button type="button" data-act="special" id="btnSpecial" aria-label="ひっさつ技 りんごの雨">ひっさつ</button>
        <button type="button" data-act="throw" aria-label="りんごをなげる">なげる</button>
      </div>
      <button type="button" data-act="jump" aria-label="ジャンプ">ジャンプ</button>
    </div>
  </div>
</div>

<script>
(() => {
'use strict';
// ===== 基本設定 =====
const VW = 640, VH = 360, T = 30, ROWS = 12;
const FONT = '"Kiwi Maru", "Hiragino Maru Gothic ProN", "Yu Gothic", "Meiryo", sans-serif';
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
let scale = 1;

function resize() {
  const r = document.getElementById('stage').getBoundingClientRect();
  const s = Math.max(0.2, Math.min(r.width / VW, r.height / VH));
  const w = Math.floor(VW * s), h = Math.floor(VH * s);
  cv.style.width = w + 'px'; cv.style.height = h + 'px';
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.max(1, Math.round(w * dpr)); cv.height = Math.max(1, Math.round(h * dpr));
  scale = cv.width / VW;
}
window.addEventListener('resize', resize);

// ===== 保存（ハイスコア） =====
function loadHi() { try { return parseInt(localStorage.getItem('towa-hi') || '0', 10) || 0; } catch (e) { return 0; } }
function saveHi() {
  if (G.score > G.hi) G.hi = G.score;
  try { localStorage.setItem('towa-hi', String(G.hi)); } catch (e) {}
}

// ===== サウンド =====
let AC = null, master = null, muted = false;
function ensureAudio() {
  if (!AC) {
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      master = AC.createGain(); master.gain.value = muted ? 0 : 0.9; master.connect(AC.destination);
    } catch (e) { AC = null; }
  }
  if (AC && AC.state === 'suspended') AC.resume();
}
const mf = n => 440 * Math.pow(2, (n - 69) / 12);
function tone(f, d, type, vol, slide, when) {
  if (!AC) return;
  const t = when != null ? when : AC.currentTime;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'square';
  o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + d);
  g.gain.setValueAtTime(vol || 0.06, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g); g.connect(master);
  o.start(t); o.stop(t + d + 0.03);
}
const now = () => (AC ? AC.currentTime : 0);
const SFX = {
  jump: () => tone(380, 0.14, 'square', 0.05, 760),
  stomp: () => { tone(220, 0.08, 'square', 0.07, 110); tone(660, 0.1, 'triangle', 0.06, 990, now() + 0.05); },
  apple: () => { tone(988, 0.07, 'triangle', 0.08); tone(1319, 0.12, 'triangle', 0.07, null, now() + 0.06); },
  throw: () => tone(600, 0.1, 'sawtooth', 0.035, 300),
  empty: () => tone(160, 0.12, 'square', 0.04),
  hurt: () => { tone(300, 0.25, 'sawtooth', 0.06, 90); },
  juice: () => [784, 988, 1175, 1568].forEach((f, i) => tone(f, 0.12, 'triangle', 0.07, null, now() + i * 0.06)),
  block: () => tone(180, 0.07, 'square', 0.06, 260),
  check: () => [660, 880].forEach((f, i) => tone(f, 0.12, 'triangle', 0.07, null, now() + i * 0.08)),
  kill: () => tone(500, 0.18, 'square', 0.05, 1200),
  die: () => [523, 494, 466, 392, 330, 262].forEach((f, i) => tone(f, 0.16, 'triangle', 0.08, null, now() + i * 0.12)),
  clear: () => [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => tone(f, i === 6 ? 0.5 : 0.13, 'triangle', 0.08, null, now() + i * 0.11)),
  boss: () => { tone(140, 0.3, 'sawtooth', 0.07, 70); tone(900, 0.15, 'square', 0.04, 400, now() + 0.05); },
  bossDown: () => [392, 330, 262, 196, 131].forEach((f, i) => tone(f, 0.22, 'sawtooth', 0.06, null, now() + i * 0.14)),
  over: () => [392, 370, 349, 330].forEach((f, i) => tone(f, 0.35, 'triangle', 0.07, null, now() + i * 0.3)),
  start: () => [659, 784, 988, 1319].forEach((f, i) => tone(f, 0.12, 'square', 0.05, null, now() + i * 0.07)),
};
const SONGS = {
  day:   { tempo: 0.16, mel: [72,0,76,79, 77,0,76,74, 72,0,74,76, 74,0,0,0, 72,0,76,79, 81,0,79,77, 76,74,72,74, 72,0,0,0],
           bass: [48,0,55,0, 53,0,55,0, 48,0,55,0, 55,0,50,0, 48,0,55,0, 53,0,57,0, 55,0,55,0, 48,0,48,0] },
  tree:  { tempo: 0.14, mel: [67,71,74,71, 72,76,74,71, 69,72,71,67, 69,0,0,0, 67,71,74,79, 78,74,76,72, 71,69,67,69, 67,0,0,0],
           bass: [43,0,50,0, 48,0,50,0, 45,0,50,0, 50,0,38,0, 43,0,50,0, 48,0,48,0, 50,0,50,0, 43,0,43,0] },
  night: { tempo: 0.2,  mel: [69,0,72,76, 74,0,72,71, 69,0,71,72, 71,0,0,0, 69,0,72,76, 77,0,76,74, 72,71,69,68, 69,0,0,0],
           bass: [45,0,52,0, 50,0,52,0, 45,0,52,0, 52,0,40,0, 45,0,52,0, 53,0,52,0, 52,0,52,0, 45,0,45,0] },
  boss:  { tempo: 0.12, mel: [57,0,57,60, 57,0,62,0, 57,0,57,63, 62,0,60,0, 57,0,57,60, 57,0,64,0, 65,64,62,60, 59,0,56,0],
           bass: [33,45,33,45, 33,45,33,45, 31,43,31,43, 32,44,32,44, 33,45,33,45, 33,45,33,45, 29,41,29,41, 28,40,28,40] },
  orchard: { tempo: 0.15, mel: [65,69,72,69, 70,74,72,69, 67,70,69,65, 67,0,72,0, 65,69,72,77, 76,72,74,70, 69,67,65,67, 65,0,0,0],
           bass: [41,0,48,0, 46,0,48,0, 43,0,48,0, 48,0,36,0, 41,0,48,0, 46,0,46,0, 48,0,48,0, 41,0,41,0] },
  cave:  { tempo: 0.22, mel: [62,0,65,0, 69,0,67,65, 64,0,0,0, 62,0,0,0, 62,0,65,0, 70,0,69,67, 69,0,0,0, 0,0,0,0],
           bass: [38,0,0,0, 38,0,0,0, 36,0,0,0, 38,0,0,0, 34,0,0,0, 34,0,0,0, 33,0,0,0, 33,0,0,0] },
  snow:  { tempo: 0.18, mel: [76,0,79,0, 84,0,83,79, 81,0,77,0, 79,0,0,0, 72,0,76,0, 79,0,77,76, 74,0,71,0, 72,0,0,0],
           bass: [48,0,55,0, 52,0,55,0, 53,0,57,0, 55,0,55,0, 45,0,52,0, 48,0,52,0, 50,0,55,0, 48,0,48,0] },
  midboss: { tempo: 0.13, mel: [62,0,62,65, 62,0,67,0, 62,0,62,68, 67,0,65,0, 62,65,69,65, 62,65,70,69, 67,65,64,62, 61,0,0,0],
           bass: [38,50,38,50, 38,50,38,50, 36,48,36,48, 37,49,37,49, 38,50,38,50, 34,46,34,46, 33,45,33,45, 33,45,33,45] },
};
SFX.ready = () => [1047, 1319, 1568].forEach((f, i) => tone(f, 0.12, 'triangle', 0.07, null, now() + i * 0.06));
SFX.special = () => [523, 659, 784, 1047, 1319, 1568, 2093].forEach((f, i) => tone(f, 0.16, 'square', 0.05, null, now() + i * 0.05));
SFX.spring = () => tone(260, 0.28, 'sine', 0.09, 980);
SFX.crumble = () => tone(130, 0.18, 'sawtooth', 0.04, 60);
SFX.oneup = () => [784, 988, 1175, 1568, 1319, 1568].forEach((f, i) => tone(f, 0.1, 'square', 0.05, null, now() + i * 0.07));
const bgm = { on: false, song: null, step: 0, next: 0, timer: 0 };
function startBgm(name) {
  stopBgm();
  if (!AC) return;
  bgm.song = SONGS[name]; bgm.step = 0; bgm.next = AC.currentTime + 0.08; bgm.on = true;
  bgm.timer = setInterval(scheduleBgm, 40);
}
function stopBgm() { bgm.on = false; if (bgm.timer) clearInterval(bgm.timer); bgm.timer = 0; }
function scheduleBgm() {
  if (!bgm.on || !AC) return;
  if (bgm.next < AC.currentTime - 0.5) bgm.next = AC.currentTime + 0.05;
  while (bgm.next < AC.currentTime + 0.25) {
    const s = bgm.song, i = bgm.step % s.mel.length;
    if (s.mel[i]) tone(mf(s.mel[i]), s.tempo * 0.9, 'triangle', 0.045, null, bgm.next);
    if (s.bass[i]) tone(mf(s.bass[i]), s.tempo * 1.6, 'square', 0.018, null, bgm.next);
    bgm.next += s.tempo; bgm.step++;
  }
}
function setMuted(m) {
  muted = m;
  if (master) master.gain.value = m ? 0 : 0.9;
  document.getElementById('muteWave').toggleAttribute('hidden', m);
  document.getElementById('muteX').toggleAttribute('hidden', !m);
  document.getElementById('btnMute').setAttribute('aria-label', m ? '音を出す' : '音を消す');
}

// ===== 入力 =====
const kb = {}, tc = {}, jp = {};
const KEYMAP = {
  ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
  Space: 'jump', ArrowUp: 'jump', KeyZ: 'jump', KeyW: 'jump',
  KeyX: 'throw', KeyC: 'throw', KeyJ: 'throw',
  KeyS: 'special', KeyV: 'special',
  Enter: 'start', KeyP: 'pause', Escape: 'pause',
};
const gp = {};
const held = a => !!(kb[a] || tc[a] || gp[a]);
window.addEventListener('keydown', e => {
  const a = KEYMAP[e.code]; if (!a) return;
  e.preventDefault(); ensureAudio();
  if (!e.repeat) jp[a] = true;
  kb[a] = true;
});
window.addEventListener('keyup', e => { const a = KEYMAP[e.code]; if (a) kb[a] = false; });
window.addEventListener('blur', () => { for (const k in kb) kb[k] = false; for (const k in tc) tc[k] = false; });

function enableTouchUI() { document.body.classList.add('touch'); resize(); }
try { if (window.matchMedia('(pointer: coarse)').matches) document.body.classList.add('touch'); } catch (e) {}
window.addEventListener('touchstart', () => { if (!document.body.classList.contains('touch')) enableTouchUI(); }, { passive: true });

// 十字（左右）パッド：指をすべらせても左右が切り替わる
const dpad = document.getElementById('dpad');
const dpadPtrs = new Map();
function dpadUpdate() {
  let l = false, r = false;
  const rc = dpad.getBoundingClientRect();
  for (const x of dpadPtrs.values()) { if (x < rc.left + rc.width / 2) l = true; else r = true; }
  tc.left = l; tc.right = r;
  dpad.classList.toggle('on-l', l); dpad.classList.toggle('on-r', r);
}
dpad.addEventListener('pointerdown', e => { e.preventDefault(); ensureAudio(); try { dpad.setPointerCapture(e.pointerId); } catch (_) {} dpadPtrs.set(e.pointerId, e.clientX); dpadUpdate(); });
dpad.addEventListener('pointermove', e => { if (dpadPtrs.has(e.pointerId)) { dpadPtrs.set(e.pointerId, e.clientX); dpadUpdate(); } });
['pointerup', 'pointercancel', 'lostpointercapture'].forEach(t => dpad.addEventListener(t, e => { dpadPtrs.delete(e.pointerId); dpadUpdate(); }));

document.querySelectorAll('#acts button').forEach(b => {
  const act = b.dataset.act;
  b.addEventListener('pointerdown', e => {
    e.preventDefault(); ensureAudio();
    try { b.setPointerCapture(e.pointerId); } catch (_) {}
    tc[act] = true; jp[act] = true; b.classList.add('on');
    if (act === 'jump') jp.start = true;
  });
  const up = () => { tc[act] = false; b.classList.remove('on'); };
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(t => b.addEventListener(t, up));
  b.addEventListener('contextmenu', e => e.preventDefault());
});
cv.addEventListener('pointerdown', e => { e.preventDefault(); ensureAudio(); jp.start = true; });
document.getElementById('btnPause').addEventListener('click', () => { ensureAudio(); jp.pause = true; });
document.getElementById('btnMute').addEventListener('click', () => { ensureAudio(); setMuted(!muted); });
document.addEventListener('visibilitychange', () => { if (document.hidden && G.state === 'play') { G.state = 'pause'; stopBgm(); } });

// ===== ゲームパッド（外部コントローラー） =====
// ブラウザの決まりで、パッドはボタンを1回押したあとに使えるようになる
let gpPrev = {}, padActive = false, padToast = 0;
function onPadFound() {
  if (!padActive) { padActive = true; padToast = 150; }
  ensureAudio();
  if (document.body.classList.contains('touch')) { document.body.classList.remove('touch'); resize(); }
}
window.addEventListener('gamepadconnected', () => { padToast = 150; });
function pollGamepad() {
  let pads = [];
  try { pads = navigator.getGamepads ? Array.from(navigator.getGamepads() || []) : []; } catch (e) { return; }
  const cur = { left: false, right: false, jump: false, throw: false, special: false, start: false, back: false };
  let any = false;
  for (const p of pads) {
    if (!p || p.connected === false) continue;
    const b = i => !!(p.buttons[i] && (p.buttons[i].pressed || p.buttons[i].value > 0.5));
    const ax = p.axes[0] || 0;
    if (ax < -0.35 || b(14)) cur.left = true;
    if (ax > 0.35 || b(15)) cur.right = true;
    if (b(0) || b(12)) cur.jump = true;
    if (b(1) || b(2) || b(5) || b(7)) cur.throw = true;
    if (b(3) || b(4) || b(6)) cur.special = true;
    if (b(9)) cur.start = true;
    if (b(8)) cur.back = true;
    if (Math.abs(ax) > 0.35 || p.buttons.some(x => x && x.pressed)) any = true;
  }
  if (any) onPadFound();
  gp.left = cur.left; gp.right = cur.right; gp.jump = cur.jump; gp.throw = cur.throw;
  if (cur.jump && !gpPrev.jump) jp.jump = true;
  if (cur.throw && !gpPrev.throw) jp.throw = true;
  if (cur.special && !gpPrev.special) jp.special = true;
  if (cur.start && !gpPrev.start) { if (G.state === 'play' || G.state === 'pause') jp.pause = true; else jp.start = true; }
  if (cur.back && !gpPrev.back) jp.back = true;
  gpPrev = cur;
}
function rumble() {
  try {
    for (const p of navigator.getGamepads ? navigator.getGamepads() : []) {
      if (p && p.vibrationActuator && p.vibrationActuator.playEffect) {
        p.vibrationActuator.playEffect('dual-rumble', { duration: 180, strongMagnitude: 0.6, weakMagnitude: 0.4 }).catch(() => {});

// ===== 便利関数 =====
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
const hash = i => { const s = Math.sin(i * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };

// ===== ステージ =====
function makeLevel(w) {
  const g = [];
  for (let r = 0; r < ROWS; r++) g.push(new Array(w).fill('.'));
  const L = { w, g, ents: [], movers: [], start: { x: 2, y: 9 } };
  L.fill = (x0, x1, y0, y1, c) => { for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) if (x >= 0 && x < w && y >= 0 && y < ROWS) g[y][x] = c; };
  L.ground = (x0, x1, h) => L.fill(x0, x1, ROWS - h, ROWS - 1, '#');
  L.row = (x0, x1, y, c) => L.fill(x0, x1, y, y, c);
  L.put = (x, y, c) => { g[y][x] = c; };
  L.e = (type, x, y, o) => L.ents.push(Object.assign({ type, x, y }, o || {}));
  L.apples = (pts) => pts.forEach(p => L.e('apple', p[0], p[1]));
  L.mover = (x, y, len, dx, dy, period) => L.movers.push({ x, y, len, dx, dy, period });
  return L;
}

const G = {
  state: 'title', stageIdx: 0, score: 0, lives: 3, hi: loadHi(), t: 0, timer: 0,
  shake: 0, cam: 0, checkpoint: null, ammo: 3, msg: null, combo: 0, appleTimer: 0, gauge: 0, rain: null,
};
let L = null, P = null, enemies = [], items = [], shots = [], hazards = [], parts = [], movers = [], boss = null;

const isSolid = c => c === '#' || c === 'B' || c === 'Q' || c === 'U' || c === 'S' || c === 'C' || c === 'I';
const crumbles = new Map();
const HOLES = [80, 250, 410, 580];
const stageSong = () => STAGES[G.stageIdx].song || STAGES[G.stageIdx].theme;
function tileAt(tx, ty) {
  if (tx < 0 || tx >= L.w) return '#';
  if (ty < 0 || ty >= ROWS) return '.';
  return L.g[ty][tx];
}

function loadStage(i) {
  const S = STAGES[i];
  L = S.build();
  enemies = []; items = []; shots = []; hazards = []; parts = []; boss = null;
  crumbles.clear(); bumps.length = 0;
  movers = L.movers.map(m => ({ bx: m.x * T, by: m.y * T, x: m.x * T, y: m.y * T, w: m.len * T, h: 14, dx: m.dx, dy: m.dy, period: m.period, t: 0, vx: 0, vy: 0 }));
  for (const e of L.ents) {
    if (e.type === 'apple') items.push({ type: 'apple', x: e.x * T + 7, y: e.y * T + 7, w: 16, h: 16, t: hash(e.x + e.y) * 100 });
    else if (e.type === 'juice') items.push({ type: 'juice', x: e.x * T + 6, y: e.y * T, w: 18, h: 30, t: 0 });
    else if (e.type === 'goal') items.push({ type: 'goal', x: e.x * T - 4, y: (e.y + 1) * T - 66, w: 38, h: 66, t: 0 });
    else if (e.type === 'check') items.push({ type: 'check', x: e.x * T + 6, y: (e.y + 1) * T - 40, w: 18, h: 40, t: 0, tx: e.x, ty: e.y, on: false });
    else enemies.push(makeEnemy(e));
  }
  let sx = L.start.x, sy = L.start.y;
  const cp = G.checkpoint;
  if (cp && cp.stage === i) {
    sx = cp.x; sy = cp.y;
    items.forEach(it => { if (it.type === 'check' && it.tx === cp.x) it.on = true; });
  }
  P = { x: sx * T + 6, y: (sy + 1) * T - 26, w: 18, h: 26, vx: 0, vy: 0, face: 1, onGround: false, onMover: null,
        hp: 3, inv: 0, ammo: Math.max(3, G.ammo), thrCd: 0, throwT: 0, jbuf: 0, coyote: 0, walk: 0, squash: 0, pb: 0, onIce: false };
  if (S.boss === 'crow') {
    boss = { kind: 'crow', x: 14 * T, y: -70, w: 54, h: 36, hp: 6, max: 6, st: 'enter', t: 0, inv: 0, dir: -1, vx: 0, vy: 0, face: -1, rot: 0 };
  } else if (S.boss === 'mole') {
    boss = { kind: 'mole', x: 410 - 22, y: 10 * T, w: 44, h: 40, hp: 4, max: 4, st: 'enter', t: 0, inv: 0, face: -1, vy: 0, rot: 0, hx: 410 };
  }
  G.appleTimer = 0;
  G.cam = clamp(P.x - VW * 0.42, 0, Math.max(0, L.w * T - VW));
  G.msg = null; G.combo = 0;
}

function makeEnemy(e) {
  const sizes = { walker: [24, 16], mush: [22, 22], bee: [22, 18], spiky: [22, 20], bird: [22, 16], snowball: [22, 22], rock: [14, 24] };
  const [w, h] = sizes[e.type];
  const o = { type: e.type, w, h, x: e.x * T + (T - w) / 2, y: (e.y + 1) * T - h, vx: 0, vy: 0, alive: true, dead: 0, t: Math.floor(hash(e.x) * 120), awake: false, face: -1, onGround: false };
  if (e.type === 'walker') o.vx = -0.8;
  if (e.type === 'mush') o.vx = -0.5;
  if (e.type === 'spiky') o.vx = -0.6;
  if (e.type === 'snowball') o.vx = -1.4;
  if (e.type === 'bee' || e.type === 'bird') { o.bx = o.x; o.by = e.y * T + 6; o.y = o.by; o.range = e.range || 2; }
  if (e.type === 'rock') { o.y = e.y * T; o.st = 'hang'; }
  o.stompable = e.type !== 'spiky' && e.type !== 'rock';
  return o;
}

// タイルとの当たり判定つき移動
function moveBody(b, dx, dy) {
  const res = { wall: false, landed: false, head: null };
  b.x += dx;
  if (dx !== 0) {
    const y0 = Math.floor(b.y / T), y1 = Math.floor((b.y + b.h - 0.01) / T);
    if (dx > 0) {
      const tx = Math.floor((b.x + b.w - 0.01) / T);
      for (let y = y0; y <= y1; y++) if (isSolid(tileAt(tx, y))) { b.x = tx * T - b.w; res.wall = true; break; }
    } else {
      const tx = Math.floor(b.x / T);
      for (let y = y0; y <= y1; y++) if (isSolid(tileAt(tx, y))) { b.x = (tx + 1) * T; res.wall = true; break; }
    }
  }
  const prevBottom = b.y + b.h;
  b.y += dy;
  const x0 = Math.floor(b.x / T), x1 = Math.floor((b.x + b.w - 0.01) / T);
  if (dy > 0) {
    const ty = Math.floor((b.y + b.h - 0.01) / T);
    for (let x = x0; x <= x1; x++) {
      const c = tileAt(x, ty);
      if (isSolid(c) || (c === '=' && prevBottom <= ty * T + 0.5)) { b.y = ty * T - b.h; res.landed = true; break; }
    }
  } else if (dy < 0) {
    const ty = Math.floor(b.y / T);
    let best = null, bestOv = -1;
    for (let x = x0; x <= x1; x++) {
      if (isSolid(tileAt(x, ty))) {
        const ov = Math.min(b.x + b.w, (x + 1) * T) - Math.max(b.x, x * T);
        if (ov > bestOv) { bestOv = ov; best = x; }
      }
    }
    if (best !== null) { b.y = (ty + 1) * T; res.head = { x: best, y: ty }; }
  }
  return res;
}

// ===== パーティクル =====
function burst(x, y, color, n, spd) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = (spd || 2) * (0.4 + Math.random());
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 1, life: 30 + Math.random() * 20, max: 50, color, size: 2 + Math.random() * 2, g: 0.12 });
  }
}
function floatText(x, y, text, color) { parts.push({ x, y, vx: 0, vy: -0.8, life: 50, max: 50, text, color: color || '#fbf5e8', g: 0 }); }
function addScore(n, x, y) { G.score += n; if (x != null) floatText(x, y, '+' + n); }

// ===== 流れ =====
function startGame() {
  G.score = 0; G.lives = 3; G.stageIdx = 0; G.ammo = 3; G.checkpoint = null; G.gauge = 0;
  SFX.start(); toIntro();
}
function toIntro() { stopBgm(); G.rain = null; rainDrops = []; loadStage(G.stageIdx); G.state = 'intro'; G.timer = 130; }
function hurtPlayer() {
  if (P.inv > 0 || G.state !== 'play' || G.rain) return;
  P.hp--; P.inv = 100; SFX.hurt(); if (padActive) rumble();
  P.vx = -P.face * 3; P.vy = -5; P.onGround = false; P.onMover = null; G.shake = 8;
  if (P.hp <= 0) killPlayer();
}
function killPlayer() {
  if (G.state !== 'play') return;
  G.state = 'dying'; G.timer = 110; P.vy = -8; P.vx = 0; P.hp = 0;
  stopBgm(); SFX.die();
}
function stageClear() {
  G.state = 'clear'; G.timer = 170; stopBgm(); SFX.clear();
  const bonus = P.hp * 300, appleBonus = P.ammo * 50;
  G.score += bonus + appleBonus;
  G.msg = { text: 'ステージクリア！', sub: 'HP ボーナス +' + bonus + '　りんごボーナス +' + appleBonus + '（' + P.ammo + '個×50）' };
  G.ammo = P.ammo;
}

function update() {
  pollGamepad();
  if (btnSpecial) { const rd = G.gauge >= 100; if (btnSpecial.classList.contains('ready') !== rd) btnSpecial.classList.toggle('ready', rd); }
  if (padToast > 0) padToast--;
  G.t++;
  if (G.shake > 0) G.shake--;
  switch (G.state) {
    case 'title':
      if (jp.start || jp.jump) { ensureAudio(); startGame(); }
      break;
    case 'intro':
      G.timer--;
      if (G.timer <= 0 || (G.timer < 100 && (jp.start || jp.jump))) {
        G.state = 'play'; startBgm(stageSong());
      }
      break;
    case 'play':
      if (jp.pause) { G.state = 'pause'; stopBgm(); break; }
      updatePlay();
      break;
    case 'pause':
      if (jp.pause || jp.start) { G.state = 'play'; startBgm(stageSong()); }
      break;
    case 'dying':
      G.timer--; P.vy += 0.4; P.y += P.vy; updateParts();
      if (G.timer <= 0) {
        G.lives--; G.ammo = Math.max(3, P.ammo);
        if (G.lives < 0) { G.state = 'gameover'; G.timer = 60; saveHi(); SFX.over(); }
        else toIntro();
      }
      break;
    case 'clear': {
      G.timer--;
      P.vy += 0.5;
      const r = moveBody(P, 0, P.vy);
      if (r.landed) { P.vy = 0; if (G.timer % 30 < 15) P.vy = -5; }
      for (const m of movers) updateMover(m);
      updateParts();
      if (G.t % 6 === 0) burst(P.x + P.w / 2 + (Math.random() - 0.5) * 60, P.y - 10, ['#f3d75a', '#e2434b', '#a6d79a'][G.t % 3], 3, 2);
      if (G.timer <= 0) {
        G.stageIdx++; G.checkpoint = null;
        if (G.stageIdx >= STAGES.length) { G.state = 'ending'; G.timer = 0; saveHi(); stopBgm(); startBgm('day'); }
        else toIntro();
      }
      break;
    }
    case 'gameover':
      G.timer--;
      if (G.timer <= 0 && (jp.pause || jp.back)) G.state = 'title';
      else if (G.timer <= 0 && (jp.start || jp.jump)) {
        G.score = 0; G.lives = 3; G.ammo = 3; G.checkpoint = null; SFX.start(); toIntro();
      }
      break;
    case 'ending':
      G.timer++;
      if (G.t % 4 === 0) parts.push({ x: Math.random() * VW, y: -10, vx: (Math.random() - 0.5) * 0.6, vy: 1 + Math.random(), life: 400, max: 400, color: ['#f3d75a', '#e2434b', '#a6d79a', '#fbf5e8'][Math.floor(Math.random() * 4)], size: 3, g: 0, conf: true });
      updateParts();
      if (G.timer > 90 && (jp.start || jp.jump)) { stopBgm(); parts = []; G.state = 'title'; }
      break;
  }
  for (const k in jp) jp[k] = false;
}

function updateMover(m) {
  m.t++;
  const k = 0.5 - 0.5 * Math.cos(m.t * 2 * Math.PI / m.period);
  const nx = m.bx + m.dx * T * k, ny = m.by + m.dy * T * k;
  m.vx = nx - m.x; m.vy = ny - m.y; m.x = nx; m.y = ny;
}

// ===== 必殺技「りんごの雨」 =====
let rainDrops = [];
const btnSpecial = document.getElementById('btnSpecial');
function addGauge(n) {
  if (G.rain || G.gauge >= 100) return;
  G.gauge = Math.min(100, G.gauge + n);
  if (G.gauge >= 100) { SFX.ready(); if (P) floatText(P.x + P.w / 2, P.y - 22, 'ひっさつ OK!', '#f3d75a'); }
}
function startRain() {
  G.gauge = 0; G.rain = { t: 0 }; rainDrops = [];
  P.throwT = 40; SFX.special();
}
function updateRain() {
  const R = G.rain; R.t++;
  if (R.t < 70 && Math.random() < 0.65) {
    rainDrops.push({ x: G.cam + Math.random() * VW, y: -20 - Math.random() * 40, vy: 5 + Math.random() * 4, r: 5 + Math.random() * 5, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 0.3 });
  }
  for (const d of rainDrops) { d.y += d.vy; d.rot += d.vr; }
  rainDrops = rainDrops.filter(d => {
    if (d.y < VH + 20) return true;
    return false;
  });
  if (R.t % 5 === 0 && R.t < 80) tone(700 + Math.random() * 500, 0.06, 'triangle', 0.04);
  if (R.t === 30) {
    for (const e of enemies) {
      if (e.alive && e.x + e.w > G.cam - 20 && e.x < G.cam + VW + 20) killEnemyByShot(e, { vx: e.x > P.x ? 1 : -1 });
    }
    hazards = [];
    if (boss && boss.st !== 'down' && boss.st !== 'gone' && boss.st !== 'enter') {
      for (let i = 0; i < 2 && boss.hp > 0; i++) { boss.inv = 0; damageBoss(); }
    }
    G.shake = 14;
  }
  if (R.t === 60) {
    for (let i = 0; i < 3; i++) {
      const ax = clamp(P.x + (i - 1) * 50 + P.w / 2 - 8, G.cam + 10, G.cam + VW - 30);
      items.push({ type: 'apple', x: ax, y: P.y - 30, w: 16, h: 16, t: 0 });
    }
  }
  if (R.t >= 110) { G.rain = null; rainDrops = []; }
}

function updatePlay() {
  for (const m of movers) updateMover(m);
  if (jp.special && !G.rain) {
    if (G.gauge >= 100) startRain();
    else { SFX.empty(); floatText(P.x + P.w / 2, P.y - 16, 'ゲージがたりない！', '#f0868b'); }
  }
  if (G.rain) updateRain();
  updatePlayer();
  if (G.state !== 'play') return;
  updateCrumbles();
  updateEnemies();
  if (boss) { if (boss.kind === 'mole') updateMole(); else updateBoss(); }
  updateShots();
  updateHazards();
  updateItems();
  updateParts();
  const target = P.x + P.w / 2 - VW * 0.42;
  G.cam += (target - G.cam) * 0.12;
  G.cam = clamp(G.cam, 0, Math.max(0, L.w * T - VW));
}

function updatePlayer() {
  const left = held('left'), right = held('right');
  const ice = P.onGround && P.onIce;
  const acc = P.onGround ? (ice ? 0.13 : 0.45) : 0.32, max = ice ? 3.8 : 3.2;
  if (left && !right) { P.vx -= acc; P.face = -1; }
  else if (right && !left) { P.vx += acc; P.face = 1; }
  else { P.vx *= P.onGround ? (ice ? 0.985 : 0.75) : 0.94; if (Math.abs(P.vx) < 0.05) P.vx = 0; }
  if (P.inv < 80) P.vx = clamp(P.vx, -max, max);

  if (jp.jump) P.jbuf = 8; else if (P.jbuf > 0) P.jbuf--;
  if (P.onGround) P.coyote = 6; else if (P.coyote > 0) P.coyote--;
  if (P.jbuf > 0 && P.coyote > 0) {
    P.vy = -9.6; P.jbuf = 0; P.coyote = 0; P.onGround = false; P.onMover = null; P.squash = -0.3; SFX.jump();
  }
  if (!held('jump') && P.vy < -3.5 && !P.bounce) P.vy = -3.5;
  if (P.vy >= 0) P.bounce = false;
  P.vy = Math.min(P.vy + 0.5, 10);

  // 投げる
  if (P.thrCd > 0) P.thrCd--;
  if (P.throwT > 0) P.throwT--;
  if (jp.throw && P.thrCd <= 0) {
    if (P.ammo > 0) {
      P.ammo--; P.thrCd = 16; P.throwT = 12;
      shots.push({ x: P.x + P.w / 2 + P.face * 10, y: P.y + 6, vx: P.face * 6.5 + P.vx * 0.4, vy: -2.6, life: 110, b: 0, r: 0 });
      SFX.throw();
    } else {
      P.thrCd = 20; SFX.empty(); floatText(P.x + P.w / 2, P.y - 16, 'りんごがない！', '#f0868b');
    }
  }

  const carryX = P.onMover ? P.onMover.vx : 0, carryY = P.onMover ? P.onMover.vy : 0;
  const wasAir = !P.onGround, fallV = P.vy;
  P.pb = P.y + P.h;
  const r = moveBody(P, P.vx + carryX, P.vy + carryY);
  let ground = r.landed, onM = null;
  if (r.landed) P.vy = 0;
  if (r.head) {
    P.vy = 1;
    const c = tileAt(r.head.x, r.head.y);
    if (c === 'Q') {
      L.g[r.head.y][r.head.x] = 'U';
      P.ammo = Math.min(99, P.ammo + 1); addScore(10);
      SFX.apple();
      parts.push({ x: r.head.x * T + 15, y: r.head.y * T - 6, vx: 0, vy: -2.2, life: 34, max: 34, apple: true, g: 0.1 });
      floatText(r.head.x * T + 15, r.head.y * T - 20, 'りんご +1', '#f3d75a');
    } else SFX.block();
    bumpTile(r.head.x, r.head.y);
  }
  for (const m of movers) {
    if (P.vy >= 0 && P.x + P.w > m.x + 2 && P.x < m.x + m.w - 2 && P.y + P.h >= m.y - 1 && P.pb <= m.y - m.vy + 6) {
      P.y = m.y - P.h; P.vy = 0; ground = true; onM = m;
    }
  }
  // 足もとのタイル（ジャンプキノコ・くずれる足場・氷）
  P.onIce = false;
  if (r.landed) {
    const fy = Math.floor((P.y + P.h + 1) / T);
    const fx0 = Math.floor((P.x + 2) / T), fx1 = Math.floor((P.x + P.w - 2) / T);
    let spring = null;
    for (let x = fx0; x <= fx1; x++) {
      const c = tileAt(x, fy);
      if (c === 'S') spring = x;
      if (c === 'I') P.onIce = true;
      if (c === 'C' && !crumbles.has(x + ',' + fy)) { crumbles.set(x + ',' + fy, { x, y: fy, t: 0, st: 'shake' }); SFX.crumble(); }
    }
    if (spring !== null && !onM) {
      P.vy = -14; P.bounce = true; ground = false; P.coyote = 0; P.squash = -0.35;
      bumpTile(spring, fy); SFX.spring();
      burst(P.x + P.w / 2, P.y + P.h, '#f3d75a', 6, 1.5);
    }
  }
  P.onGround = ground; P.onMover = onM;
  if (ground) G.combo = 0;
  if (ground && wasAir && fallV > 4) { P.squash = 0.25; burst(P.x + P.w / 2, P.y + P.h, 'rgba(240,230,210,0.8)', 4, 1); }
  P.squash *= 0.8;
  P.walk += Math.abs(P.vx) * 0.13;
  if (P.inv > 0) P.inv--;

  // トゲ
  const x0 = Math.floor(P.x / T), x1 = Math.floor((P.x + P.w - 0.01) / T);
  const y0 = Math.floor(P.y / T), y1 = Math.floor((P.y + P.h - 0.01) / T);
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    if (tileAt(x, y) === '^' && overlap(P, { x: x * T + 4, y: y * T + 14, w: T - 8, h: T - 14 })) hurtPlayer();
  }
  if (P.y > ROWS * T + 30) killPlayer();
}

const bumps = [];
function bumpTile(x, y) { bumps.push({ x, y, t: 10 }); }

function updateEnemies() {
  for (const e of enemies) {
    if (!e.alive) {
      e.dead--;
      if (e.flip) { e.vy += 0.4; e.y += e.vy; e.x += e.vx; }
      continue;
    }
    if (!e.awake) { if (e.x - G.cam < VW + 60) e.awake = true; else continue; }
    e.t++;
    if (e.type === 'bee') {
      const px = e.x;
      e.x = e.bx + Math.sin(e.t * 0.015) * e.range * T;
      e.y = e.by + Math.sin(e.t * 0.08) * 10;
      e.face = e.x < px ? -1 : 1;
    } else if (e.type === 'bird') {
      const px = e.x;
      e.x = e.bx + Math.sin(e.t * 0.012) * 26;
      e.y = e.by + Math.sin(e.t * 0.035) * e.range * T;
      e.face = e.x < px ? -1 : 1;
    } else if (e.type === 'rock') {
      if (e.st === 'hang') {
        if (Math.abs(P.x + P.w / 2 - (e.x + e.w / 2)) < 48 && P.y > e.y) { e.st = 'shake'; e.t = 0; }
      } else if (e.st === 'shake') {
        if (e.t > 18) e.st = 'fall';
      } else {
        e.vy = Math.min(e.vy + 0.45, 10); e.y += e.vy;
        if (isSolid(tileAt(Math.floor((e.x + e.w / 2) / T), Math.floor((e.y + e.h) / T))) || e.y > ROWS * T) {
          e.alive = false; e.dead = 0; SFX.block(); burst(e.x + e.w / 2, e.y + e.h, '#8d8496', 8, 2);
        }
      }
    } else {
      e.vy = Math.min(e.vy + 0.5, 9);
      if (e.type === 'mush' && e.onGround && e.t % 150 === 0) e.vy = -6.5;
      const r = moveBody(e, e.vx, e.vy);
      if (r.wall) e.vx *= -1;
      e.onGround = r.landed;
      if (r.landed) e.vy = 0;
      if (r.landed && e.type !== 'snowball') {
        const ax = e.vx > 0 ? e.x + e.w + 1 : e.x - 1;
        const below = tileAt(Math.floor(ax / T), Math.floor((e.y + e.h + 2) / T));
        if (!isSolid(below) && below !== '=') e.vx *= -1;
      }
      e.face = e.vx < 0 ? -1 : 1;
      if (e.y > ROWS * T + 40) { e.alive = false; e.dead = 0; }
    }
    // プレイヤーとの接触
    if (G.state === 'play' && overlap(P, e)) {
      if (e.stompable && P.vy > 0 && P.pb <= e.y + 10) {
        e.alive = false; e.dead = 30; e.flat = true;
        P.vy = held('jump') ? -9.5 : -6.5; P.bounce = true;
        G.combo++;
        addScore(100 * Math.min(8, G.combo), e.x + e.w / 2, e.y - 6);
        SFX.stomp(); burst(e.x + e.w / 2, e.y + e.h / 2, '#fbf5e8', 6, 2);
        addGauge(15);
      } else {
        hurtPlayer();
      }
    }
  }
  enemies = enemies.filter(e => e.alive || e.dead > 0);
}

function killEnemyByShot(e, s) {
  e.alive = false; e.dead = 60; e.flip = true; e.vy = -5; e.vx = s.vx > 0 ? 1.5 : -1.5;
  addScore(e.type === 'spiky' ? 200 : 100, e.x + e.w / 2, e.y - 6);
  SFX.kill(); burst(e.x + e.w / 2, e.y + e.h / 2, '#e2434b', 6, 2);
  addGauge(15);
}

function updateShots() {
  for (const s of shots) {
    s.life--; s.r += s.vx * 0.06;
    s.vy = Math.min(s.vy + 0.32, 8);
    s.x += s.vx;
    if (isSolid(tileAt(Math.floor(s.x / T), Math.floor(s.y / T)))) { s.life = 0; burst(s.x, s.y, '#e2434b', 4, 1.5); continue; }
    s.y += s.vy;
    const ty = Math.floor((s.y + 5) / T), c = tileAt(Math.floor(s.x / T), ty);
    if (s.vy > 0 && (isSolid(c) || (c === '=' && s.y + 5 - s.vy <= ty * T + 1))) {
      s.y = ty * T - 5; s.vy = -s.vy * 0.55; s.vx *= 0.85; s.b++;
      if (s.b > 2) s.life = 0;
    } else if (s.vy < 0 && isSolid(tileAt(Math.floor(s.x / T), Math.floor((s.y - 5) / T)))) { s.vy = 1; }
    const box = { x: s.x - 6, y: s.y - 6, w: 12, h: 12 };
    for (const e of enemies) if (e.alive && overlap(box, e)) { killEnemyByShot(e, s); s.life = 0; break; }
    if (s.life > 0 && boss && bossHittable(boss) && overlap(box, boss)) {
      if (boss.inv <= 0) { damageBoss(); s.life = 0; }
      else { s.vx = -s.vx * 0.5; s.vy = -3; }
    }
    if (s.y > ROWS * T + 30 || s.x < G.cam - 60 || s.x > G.cam + VW + 60) s.life = 0;
  }
  shots = shots.filter(s => s.life > 0);
}

function updateHazards() {
  for (const h of hazards) {
    h.t++;
    if (h.stone) { h.vy += 0.3; h.x += h.vx; h.y += h.vy; }
    else { h.x += Math.sin(h.t * 0.08) * 1.2; h.y += h.vy; }
    if (overlap(P, { x: h.x - 5, y: h.y - 8, w: 10, h: 16 })) { hurtPlayer(); h.dead = true; }
    if (isSolid(tileAt(Math.floor(h.x / T), Math.floor((h.y + 8) / T)))) { h.dead = true; burst(h.x, h.y + 6, '#4a4458', 4, 1); }
  }
  hazards = hazards.filter(h => !h.dead);
}

function updateItems() {
  for (const it of items) {
    it.t++;
    if (it.got) continue;
    if (!overlap(P, it)) continue;
    if (it.type === 'apple') {
      it.got = true; P.ammo = Math.min(99, P.ammo + 1); addScore(10); addGauge(2);
      SFX.apple(); burst(it.x + 8, it.y + 8, '#f3d75a', 6, 1.5);
    } else if (it.type === 'juice') {
      it.got = true;
      if (P.hp < 3) { P.hp++; floatText(it.x + 9, it.y - 4, 'HP +1', '#a6d79a'); }
      else addScore(500, it.x + 9, it.y - 4);
      SFX.juice(); burst(it.x + 9, it.y + 12, '#f3d75a', 10, 2);
    } else if (it.type === 'check' && !it.on) {
      it.on = true; G.checkpoint = { stage: G.stageIdx, x: it.tx, y: it.ty };
      SFX.check(); burst(it.x + 9, it.y + 6, '#f4a7b9', 10, 2); floatText(it.x + 9, it.y - 10, 'チェックポイント', '#a6d79a');
    } else if (it.type === 'goal') {
      stageClear(); return;
    }
  }
  items = items.filter(it => !it.got);
  if (boss) {
    G.appleTimer++;
    const apples = items.filter(i => i.type === 'apple').length;
    if (G.appleTimer > 300 && apples < 2 && P.ammo < 4) {
      G.appleTimer = 0;
      const spots = L.appleSpots || [[5, 7], [16, 7], [10, 9], [12, 9]];
      const sp = spots[Math.floor(Math.random() * spots.length)];
      items.push({ type: 'apple', x: sp[0] * T + 7, y: sp[1] * T + 7, w: 16, h: 16, t: 0 });
      burst(sp[0] * T + 15, sp[1] * T + 15, '#f3d75a', 6, 1.5);
    }
  }
}

function updateParts() {
  for (const p of parts) { p.life--; p.vy += p.g || 0; p.x += p.vx; p.y += p.vy; }
  parts = parts.filter(p => p.life > 0 && p.y < VH + 40);
  for (const b of bumps) b.t--;
  for (let i = bumps.length - 1; i >= 0; i--) if (bumps[i].t <= 0) bumps.splice(i, 1);
}

// ===== ボス：いじわるカラス =====
function damageBoss() {
  if (boss.inv > 0) return;
  boss.hp--; boss.inv = 50; G.shake = 10; addGauge(10);
  SFX.boss(); burst(boss.x + boss.w / 2, boss.y + boss.h / 2, '#2b2733', 12, 3);
  addScore(300, boss.x + boss.w / 2, boss.y - 8);
  if (boss.hp <= 0) {
    boss.st = 'down'; boss.t = 0; boss.vy = -5; stopBgm(); SFX.bossDown(); addScore(boss.kind === 'mole' ? 1000 : 2000);
    hazards = [];
  } else if (boss.kind === 'mole') { boss.st = 'sink'; boss.t = 0; }
  else if (boss.st === 'tired' || boss.st === 'swoop') { boss.st = 'rise'; boss.t = 0; }
}
function bossHittable(B) {
  if (B.kind === 'mole') return (B.st === 'up' || B.st === 'throw' || B.st === 'rest') && B.y < 10 * T - 8;
  return B.st !== 'down' && B.st !== 'gone';
}

// ===== 中ボス：いばりモグラ =====
function updateMole() {
  const B = boss, gy = 10 * T, angry = B.hp <= 2;
  B.t++; if (B.inv > 0) B.inv--;
  if (B.st !== 'down' && B.st !== 'gone') B.face = P.x + P.w / 2 < B.x + B.w / 2 ? -1 : 1;
  switch (B.st) {
    case 'enter':
      if (B.t > 60) { B.st = 'under'; B.t = 0; }
      break;
    case 'under':
      if (B.t > (angry ? 30 : 50)) {
        const pc = P.x + P.w / 2;
        let best = HOLES[0], bd = Infinity;
        for (const h of HOLES) { const d = Math.abs(h - pc); const sc = d < 50 ? 1e6 + d : d; if (sc < bd) { bd = sc; best = h; } }
        B.hx = best; B.x = best - B.w / 2; B.st = 'warn'; B.t = 0;
      }
      break;
    case 'warn':
      if (B.t % 6 === 0) burst(B.hx + (Math.random() - 0.5) * 20, gy - 2, '#7a5a40', 2, 1.5);
      if (B.t > 35) { B.st = 'up'; B.t = 0; }
      break;
    case 'up':
      B.y = gy - B.h * Math.min(1, B.t / 14);
      if (B.t >= 14) { B.st = 'throw'; B.t = 0; }
      break;
    case 'throw': {
      const n = angry ? 3 : 2;
      if (B.t % 28 === 14 && B.t < 28 * n) {
        const sx = B.x + B.w / 2, sy = B.y + 6;
        const vx = clamp((P.x + P.w / 2 - sx) / 46, -5, 5);
        hazards.push({ stone: true, x: sx, y: sy, vx, vy: -7, t: 0 });
        SFX.throw();
      }
      if (B.t >= 28 * n) { B.st = 'rest'; B.t = 0; }
      break;
    }
    case 'rest':
      if (B.t > (angry ? 50 : 85)) { B.st = 'sink'; B.t = 0; }
      break;
    case 'sink':
      B.y = Math.max(B.y, gy - B.h * Math.max(0, 1 - B.t / 14));
      if (B.t >= 14) { B.y = gy; B.st = 'under'; B.t = 0; }
      break;
    case 'down':
      B.vy += 0.3; B.y += B.vy; B.rot += 0.2;
      if (B.t % 8 === 0) burst(B.x + B.w / 2, Math.min(B.y, gy), '#f3d75a', 4, 2);
      if (B.t > 90) {

  c.strokeStyle = '#5c3f28'; c.lineWidth = 1.2; c.strokeRect(m.x + 0.5, m.y + 0.5, m.w - 1, m.h - 1);
  for (let x = m.x + 10; x < m.x + m.w - 4; x += 20) { c.beginPath(); c.arc(x, m.y + 8, 2, 0, Math.PI * 2); c.stroke(); }
  c.fillStyle = '#7cc35a';
  c.beginPath(); c.ellipse(m.x + 6, m.y, 7, 3, -0.3, 0, Math.PI * 2); c.ellipse(m.x + m.w - 8, m.y, 6, 3, 0.4, 0, Math.PI * 2); c.fill();
}
function drawItem(c, it) {
  if (it.type === 'apple') {
    drawApple(c, it.x + 8, it.y + 9 + Math.sin(it.t * 0.08) * 2, 7, Math.sin(it.t * 0.05) * 0.15);
  } else if (it.type === 'juice') {
    const glow = c.createRadialGradient(it.x + 9, it.y + 14, 2, it.x + 9, it.y + 14, 26);
    glow.addColorStop(0, 'rgba(255,240,150,0.55)'); glow.addColorStop(1, 'rgba(255,240,150,0)');
    c.fillStyle = glow; c.fillRect(it.x - 20, it.y - 14, 60, 60);
    drawJuice(c, it.x + 9, it.y + 30 + Math.sin(it.t * 0.07) * 2, 0.85);
  } else if (it.type === 'goal') {
    const cx = it.x + it.w / 2, by = it.y + it.h;
    const glow = c.createRadialGradient(cx, by - 34, 4, cx, by - 34, 70);
    glow.addColorStop(0, `rgba(255,240,150,${0.5 + 0.15 * Math.sin(it.t * 0.08)})`); glow.addColorStop(1, 'rgba(255,240,150,0)');
    c.fillStyle = glow; c.fillRect(cx - 80, by - 110, 160, 130);
    drawJuice(c, cx, by - 2, 1.9);
    if (it.t % 20 < 10) drawStar(c, cx + 18, by - 62, 4, '#fff7c2');
    else drawStar(c, cx - 16, by - 48, 3.5, '#fff7c2');
  } else if (it.type === 'check') {
    const cx = it.x + 9, by = it.y + it.h;
    c.strokeStyle = '#5d8f4f'; c.lineWidth = 2.5;
    c.beginPath(); c.moveTo(cx, by); c.quadraticCurveTo(cx - 3, by - 20, cx, by - 34); c.stroke();
    c.fillStyle = LEAF; c.strokeStyle = OL; c.lineWidth = 1;
    c.beginPath(); c.ellipse(cx - 7, by - 18, 7, 3.5, 0.5, 0, Math.PI * 2); c.fill(); c.stroke();
    c.beginPath(); c.ellipse(cx + 7, by - 24, 7, 3.5, -0.5, 0, Math.PI * 2); c.fill(); c.stroke();
    if (it.on) {
      c.fillStyle = '#f4a7b9';
      for (let k = 0; k < 5; k++) { const a = k / 5 * Math.PI * 2 + it.t * 0.02; c.beginPath(); c.arc(cx + Math.cos(a) * 5, by - 36 + Math.sin(a) * 5, 4, 0, Math.PI * 2); c.fill(); }
      c.fillStyle = '#f3d75a'; c.beginPath(); c.arc(cx, by - 36, 3.2, 0, Math.PI * 2); c.fill();
    } else {
      c.fillStyle = '#c9e6bf'; c.strokeStyle = OL;
      c.beginPath(); c.ellipse(cx, by - 37, 4, 5.5, 0, 0, Math.PI * 2); c.fill(); c.stroke();
    }
  }
}

// ===== 描画：HUD / 画面 =====
function text(c, s, x, y, size, col, align, stroke) {
  c.font = `500 ${size}px ${FONT}`; c.textAlign = align || 'left'; c.textBaseline = 'middle';
  if (stroke !== false) { c.lineWidth = Math.max(3, size / 5); c.strokeStyle = typeof stroke === 'string' ? stroke : 'rgba(30,36,28,0.85)'; c.lineJoin = 'round'; c.strokeText(s, x, y); }
  c.fillStyle = col || '#fbf5e8'; c.fillText(s, x, y);
}
function heart(c, x, y, full) {
  c.save(); c.translate(x, y);
  c.fillStyle = full ? '#e2434b' : 'rgba(40,30,30,0.45)'; c.strokeStyle = '#fbf5e8'; c.lineWidth = 1.6;
  c.beginPath(); c.moveTo(0, 5);
  c.bezierCurveTo(-9, -1, -6, -9, 0, -4); c.bezierCurveTo(6, -9, 9, -1, 0, 5);
  c.fill(); c.stroke(); c.restore();
}
function drawHUD(c) {
  c.fillStyle = 'rgba(25,32,24,0.45)';
  roundRect(c, 8, 8, 214, 30, 10); c.fill();
  for (let i = 0; i < 3; i++) heart(c, 24 + i * 22, 23, i < P.hp);
  drawApple(c, 100, 24, 6.5, 0);
  text(c, '×' + P.ammo, 110, 23, 14, '#fbf5e8', 'left');
  drawTowa(c, 158, 34, { scale: 0.5, t: G.t });
  text(c, '×' + Math.max(0, G.lives), 170, 23, 14, '#fbf5e8', 'left');
  // ひっさつゲージ
  const full = G.gauge >= 100;
  c.fillStyle = 'rgba(25,32,24,0.45)'; roundRect(c, 8, 42, 214, 16, 8); c.fill();
  text(c, 'ひっさつ', 16, 50, 10, full ? '#f3d75a' : '#e9f3dc', 'left', false);
  c.fillStyle = 'rgba(0,0,0,0.35)'; roundRect(c, 64, 46, 150, 8, 4); c.fill();
  if (G.gauge > 0) {
    c.fillStyle = full ? (Math.floor(G.t / 8) % 2 ? '#f3d75a' : '#fff1a8') : '#a6d79a';
    roundRect(c, 64, 46, Math.max(8, 150 * G.gauge / 100), 8, 4); c.fill();
  }
  if (full) text(c, padActive ? 'Y でひっさつ！' : (document.body.classList.contains('touch') ? 'ひっさつボタン！' : 'S でひっさつ！'), 230, 50, 11, '#f3d75a', 'left');
  text(c, STAGES[G.stageIdx].name, VW / 2, 23, 14, '#fbf5e8', 'center');
  text(c, 'SCORE ' + String(G.score).padStart(6, '0'), VW - 14, 23, 14, '#fbf5e8', 'right');
  if (boss && boss.st !== 'gone' && boss.st !== 'enter') {
    text(c, boss.kind === 'mole' ? 'いばりモグラ' : 'いじわるカラス', VW / 2, 46, 12, '#f0b4a8', 'center');
    c.fillStyle = 'rgba(25,20,30,0.6)'; roundRect(c, VW / 2 - 80, 56, 160, 8, 4); c.fill();
    c.fillStyle = '#e2434b'; roundRect(c, VW / 2 - 80, 56, 160 * Math.max(0, boss.hp) / boss.max, 8, 4); c.fill();
  }
  if (G.msg) {
    if (G.msg.t != null) { G.msg.t--; if (G.msg.t <= 0) G.msg = null; }
    if (G.msg) { text(c, G.msg.text, VW / 2, 140, 34, '#f3d75a', 'center'); if (G.msg.sub) text(c, G.msg.sub, VW / 2, 178, 16, '#fbf5e8', 'center'); }
  }
}
function roundRect(c, x, y, w, h, r) {
  c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
function drawParts(c) {
  for (const p of parts) {
    const a = Math.min(1, p.life / (p.max * 0.5));
    c.globalAlpha = a;
    if (p.text) text(c, p.text, p.x, p.y, 12, p.color, 'center');
    else if (p.apple) drawApple(c, p.x, p.y, 6, 0);
    else if (p.conf) { c.save(); c.translate(p.x, p.y); c.rotate(p.life * 0.1); c.fillStyle = p.color; c.fillRect(-3, -1.5, 6, 3); c.restore(); }
    else { c.fillStyle = p.color; c.beginPath(); c.arc(p.x, p.y, p.size, 0, Math.PI * 2); c.fill(); }
  }
  c.globalAlpha = 1;
}
function drawWorld(c) {
  const S = STAGES[G.stageIdx];
  const sx = G.shake > 0 ? (Math.random() - 0.5) * G.shake * 0.6 : 0, sy = G.shake > 0 ? (Math.random() - 0.5) * G.shake * 0.6 : 0;
  drawBackground(c, S.theme, G.cam);
  c.save(); c.translate(-Math.round(G.cam) + sx, sy);
  drawTiles(c, S.theme, G.cam);
  for (const m of movers) drawMover(c, m);
  for (const it of items) drawItem(c, it);
  for (const e of enemies) drawEnemy(c, e);
  if (boss && boss.kind === 'mole') {
    c.fillStyle = '#1a1410';
    for (const hx of HOLES) { c.beginPath(); c.ellipse(hx, 10 * T + 1, 24, 5, 0, 0, Math.PI * 2); c.fill(); }
    drawMole(c, boss);
  } else if (boss) drawBoss(c, boss);
  for (const h of hazards) { if (h.stone) drawStone(c, h); else drawFeather(c, h); }
  for (const s of shots) drawApple(c, s.x, s.y, 6, s.r);
  const blink = P.inv > 0 && G.state === 'play' && Math.floor(P.inv / 4) % 2 === 0;
  if (!blink) {
    drawTowa(c, P.x + P.w / 2, P.y + P.h + 1, {
      face: P.face, t: G.t, moving: Math.abs(P.vx) > 0.3, walk: P.walk, air: !P.onGround, vy: P.vy,
      squash: P.squash, throwT: P.throwT, hurt: G.state === 'dying' || P.inv > 70, happy: G.state === 'clear' || !!G.rain,
      rot: G.state === 'dying' ? Math.min(Math.PI, (110 - G.timer) * 0.06) : 0,
    });
  }
  drawParts(c);
  c.restore();
  if (S.theme === 'night') {
    const v = c.createRadialGradient(VW / 2, VH / 2, 120, VW / 2, VH / 2, 420);
    v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(5,10,20,0.45)');
    c.fillStyle = v; c.fillRect(0, 0, VW, VH);
  } else if (S.theme === 'cave') {
    const px = P.x + P.w / 2 - G.cam, py = P.y + 6;
    const v = c.createRadialGradient(px, py, 50, px, py, S.boss ? 420 : 290);
    v.addColorStop(0, 'rgba(8,6,12,0)'); v.addColorStop(1, `rgba(8,6,12,${S.boss ? 0.55 : 0.82})`);

      const sp = 0.5 + hash(i) * 0.9;
      const x = ((hash(i + 3) * VW + Math.sin(G.t * 0.02 + i) * 12 - G.cam * 0.3 * sp) % VW + VW) % VW;
      const y = (hash(i + 9) * VH + G.t * sp) % VH;
      c.beginPath(); c.arc(x, y, 1 + hash(i + 5) * 1.6, 0, Math.PI * 2); c.fill();
    }
  }
  if (G.rain) {
    c.save(); c.translate(-Math.round(G.cam), 0);
    for (const d of rainDrops) drawApple(c, d.x, d.y, d.r, d.rot);
    c.restore();
    if (G.rain.t < 16) { c.fillStyle = `rgba(255,252,230,${0.8 * (1 - G.rain.t / 16)})`; c.fillRect(0, 0, VW, VH); }
    if (G.rain.t < 70) text(c, 'りんごの雨！', VW / 2, 120, 32, '#f3d75a', 'center');
  }
  drawHUD(c);
}
function glowBackdrop(c) {
  c.fillStyle = '#1b231b'; c.fillRect(0, 0, VW, VH);
  const g = c.createRadialGradient(VW / 2, VH * 0.55, 10, VW / 2, VH * 0.55, 260);
  g.addColorStop(0, 'rgba(255,248,215,0.55)'); g.addColorStop(0.35, 'rgba(190,210,160,0.18)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  c.fillStyle = g; c.fillRect(0, 0, VW, VH);
}
function drawTitle(c) {
  drawBackground(c, 'day', G.t * 0.6);
  c.fillStyle = 'rgba(27,35,27,0.35)'; c.fillRect(0, 0, VW, VH);
  const g = c.createRadialGradient(VW / 2, 220, 10, VW / 2, 220, 150);
  g.addColorStop(0, 'rgba(255,248,215,0.7)'); g.addColorStop(1, 'rgba(255,248,215,0)');
  c.fillStyle = g; c.fillRect(0, 0, VW, VH);
  text(c, 'TOWA様のぼうけん', VW / 2, 62, 44, '#fbf5e8', 'center', '#2f4a2c');
  text(c, 'りんごをあつめて、いじわるカラスをやっつけよう', VW / 2, 104, 15, '#e9f3dc', 'center');
  drawTowa(c, VW / 2, 300 + Math.sin(G.t * 0.05) * 3, { scale: 3.1, t: G.t, hold: 'both' });
  if (Math.floor(G.t / 30) % 2 === 0) text(c, padActive ? 'A / START でスタート' : 'Enter / タップでスタート', VW / 2, 332, 17, '#f3d75a', 'center');
  if (padActive) text(c, 'スティック いどう　A ジャンプ　B なげる　Y ひっさつ　START ポーズ', 16, VH - 12, 11, '#e9f3dc', 'left');
  else if (!document.body.classList.contains('touch')) text(c, '←→ いどう　Space ジャンプ　X なげる　S ひっさつ　コントローラーOK', 16, VH - 12, 11, '#e9f3dc', 'left');
  text(c, 'HI ' + String(G.hi).padStart(6, '0'), VW - 14, VH - 12, 12, '#e9f3dc', 'right');
}
function drawIntro(c) {
  glowBackdrop(c);
  const S = STAGES[G.stageIdx];
  const label = S.boss === 'crow' ? 'BOSS' : S.boss === 'mole' ? '中ボス' : 'STAGE ' + STAGES.slice(0, G.stageIdx + 1).filter(s => !s.boss).length;
  text(c, label, VW / 2, 110, 20, '#a6d79a', 'center');
  text(c, S.name, VW / 2, 150, 36, '#fbf5e8', 'center');
  drawTowa(c, VW / 2 - 24, 250, { scale: 1.6, t: G.t });
  text(c, '× ' + G.lives, VW / 2 + 10, 228, 22, '#fbf5e8', 'left');
  text(c, S.tip || '', VW / 2, 300, 14, '#e9f3dc', 'center');
  if (G.stageIdx === 0) text(c, 'てきを倒すと ひっさつゲージがたまるよ', VW / 2, 324, 13, '#f3d75a', 'center');
}
function drawEnding(c) {
  glowBackdrop(c);
  drawParts(c);
  text(c, 'おめでとう！', VW / 2, 58, 40, '#f3d75a', 'center');
  text(c, 'いじわるカラスをやっつけた！ 森にへいわがもどったよ', VW / 2, 98, 15, '#fbf5e8', 'center');
  drawTowa(c, VW / 2, 292 + Math.sin(G.t * 0.06) * 3, { scale: 3, t: G.t, hold: 'both', happy: true });
  text(c, 'SCORE ' + G.score + '　HI ' + G.hi, VW / 2, 318, 16, '#fbf5e8', 'center');
  if (G.timer > 90 && Math.floor(G.t / 30) % 2 === 0) text(c, padActive ? 'A / START でタイトルへ' : 'Enter / タップでタイトルへ', VW / 2, 342, 13, '#a6d79a', 'center');
}

function render() {
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  ctx.imageSmoothingEnabled = true;
  switch (G.state) {
    case 'title': drawTitle(ctx); break;
    case 'intro': drawIntro(ctx); break;
    case 'play': case 'dying': case 'clear': drawWorld(ctx); break;
    case 'pause':
      drawWorld(ctx);
      ctx.fillStyle = 'rgba(20,26,20,0.6)'; ctx.fillRect(0, 0, VW, VH);
      text(ctx, 'ひとやすみ中', VW / 2, VH / 2 - 14, 30, '#fbf5e8', 'center');
      text(ctx, padActive ? 'START でつづける' : 'Enter / P / タップでつづける', VW / 2, VH / 2 + 24, 14, '#a6d79a', 'center');
      break;
    case 'gameover':
      glowBackdrop(ctx);
      drawTowa(ctx, VW / 2, 250, { scale: 2, t: G.t, hurt: true });
      text(ctx, 'ゲームオーバー', VW / 2, 110, 36, '#f0868b', 'center');
      text(ctx, 'SCORE ' + G.score + '　HI ' + G.hi, VW / 2, 290, 16, '#fbf5e8', 'center');
      if (G.timer <= 0) {
        text(ctx, padActive ? 'A / START：このステージからコンティニュー' : 'Enter / タップ：このステージからコンティニュー', VW / 2, 318, 14, '#a6d79a', 'center');
        text(ctx, padActive ? 'SELECT：タイトルへ' : 'P / 一時停止ボタン：タイトルへ', VW / 2, 342, 12, '#e9f3dc', 'center');
      }
      break;
    case 'ending': drawEnding(ctx); break;
  }
  if (padToast > 0) {
    ctx.globalAlpha = Math.min(1, padToast / 30);
    ctx.fillStyle = 'rgba(25,32,24,0.8)'; roundRect(ctx, VW / 2 - 130, VH - 52, 260, 30, 12); ctx.fill();
    text(ctx, 'コントローラーをつなぎました', VW / 2, VH - 37, 14, '#a6d79a', 'center', false);
    ctx.globalAlpha = 1;
  }
}

// ===== ループ =====
let last = performance.now(), acc = 0;
const STEP = 1000 / 60;
function frame(ts) {
  acc += Math.min(100, ts - last); last = ts;
  let n = 0;
  while (acc >= STEP && n < 5) { update(); acc -= STEP; n++; }
  if (n === 5) acc = 0;
  render();
  requestAnimationFrame(frame);
}

function boot(data) {
  data = data || {};
  if (typeof data.hi === 'number' && data.hi > G.hi) G.hi = data.hi;
  if (typeof data.stageIdx === 'number' && data.state && data.state !== 'title' && data.state !== 'ending' && data.state !== 'gameover') {
    G.score = data.score || 0; G.lives = data.lives != null ? data.lives : 3; G.stageIdx = clamp(data.stageIdx, 0, STAGES.length - 1);
    G.ammo = data.ammo || 3; toIntro();
  }
  resize();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => {}).catch(() => {});
  requestAnimationFrame(ts => { last = ts; frame(ts); });
}
try { window.claude?.hot?.snapshot?.(() => ({ hi: G.hi, score: G.score, lives: G.lives, stageIdx: G.stageIdx, state: G.state, ammo: P ? P.ammo : 3 })); } catch (e) {}
window.__towa = { G, get P() { return P; }, get boss() { return boss; }, get enemies() { return enemies; }, set enemies(v) { enemies = v; }, STAGES, loadStage, toIntro, jp, kb };
if (window.claude?.hot?.ready) window.claude.hot.ready(boot); else boot(window.claude?.hot?.data ?? {});
})();
</script>
